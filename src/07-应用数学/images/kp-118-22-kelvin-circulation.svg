   <g id="text_1">
    <text style="font-size: 10.5px; font-family: 'Noto Sans CJK SC', 'WenQuanYi Zen Hei', sans-serif; text-anchor: middle; fill: #4c72b0" x="148.7232" y="106.34199" transform="rotate(-0 148.7232 106.34199)">t = 0：圆形物质回路</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'Noto Sans CJK SC', 'WenQuanYi Zen Hei', sans-serif; text-anchor: middle; fill: #4c72b0" x="148.7232" y="233.79744" transform="rotate(-0 148.7232 233.79744)">Γ = ∮v·dl</text>
