<?xml version="1.0" encoding="utf-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="360pt" viewBox="0 0 504 360">
 <defs>
  <style type="text/css">
   text { font-family: 'Noto Sans CJK SC', 'SimHei', sans-serif; }
  </style>
 </defs>
 <rect width="504" height="360" fill="#ffffff"/>
 <!-- Title -->
 <text x="252" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">Euler 函数 φ(n)：与 n 互质的数的个数</text>
 <text x="252" y="48" text-anchor="middle" font-size="11" fill="#666666">φ(n) = n · ∏(1 - 1/p)，其中 p 取遍 n 的所有素因子</text>

 <!-- Bar chart: φ(n) for n = 1 to 20 -->
 <!-- Chart area: x from 60 to 470, y from 70 to 290 -->
 <!-- Y axis -->
 <line x1="60" y1="70" x2="60" y2="290" stroke="#333333" stroke-width="1.5"/>
 <!-- X axis -->
 <line x1="60" y1="290" x2="470" y2="290" stroke="#333333" stroke-width="1.5"/>

 <!-- Y axis labels and grid lines -->
 <text x="55" y="294" text-anchor="end" font-size="10" fill="#666666">0</text>
 <text x="55" y="250" text-anchor="end" font-size="10" fill="#666666">4</text>
 <line x1="60" y1="246" x2="470" y2="246" stroke="#eeeeee" stroke-width="0.5"/>
 <text x="55" y="206" text-anchor="end" font-size="10" fill="#666666">8</text>
 <line x1="60" y1="202" x2="470" y2="202" stroke="#eeeeee" stroke-width="0.5"/>
 <text x="55" y="162" text-anchor="end" font-size="10" fill="#666666">12</text>
 <line x1="60" y1="158" x2="470" y2="158" stroke="#eeeeee" stroke-width="0.5"/>
 <text x="55" y="118" text-anchor="end" font-size="10" fill="#666666">16</text>
 <line x1="60" y1="114" x2="470" y2="114" stroke="#eeeeee" stroke-width="0.5"/>
 <text x="55" y="74" text-anchor="end" font-size="10" fill="#666666">20</text>
 <line x1="60" y1="70" x2="470" y2="70" stroke="#eeeeee" stroke-width="0.5"/>

 <!-- Y axis title -->
 <text x="18" y="180" text-anchor="middle" font-size="12" fill="#333333" transform="rotate(-90, 18, 180)">φ(n)</text>

 <!-- Bars: φ values for n=1..20 -->
 <!-- φ(1)=1, φ(2)=1, φ(3)=2, φ(4)=2, φ(5)=4, φ(6)=2, φ(7)=6, φ(8)=4, φ(9)=6, φ(10)=4 -->
 <!-- φ(11)=10, φ(12)=4, φ(13)=12, φ(14)=6, φ(15)=8, φ(16)=8, φ(17)=16, φ(18)=6, φ(19)=18, φ(20)=8 -->
 <!-- Scale: 220 pixels for 20 units, so 11 pixels per unit. Bar width = 18, gap = 2 -->
 <!-- Bar x starts at 65, each bar takes 20px -->

 <!-- n=1, φ=1: height=11, y=279 -->
 <rect x="65" y="279" width="18" height="11" fill="#5b9bd5" stroke="#4c72b0"/>
 <text x="74" y="275" text-anchor="middle" font-size="8" fill="#4c72b0">1</text>
 <text x="74" y="303" text-anchor="middle" font-size="9" fill="#333333">1</text>

