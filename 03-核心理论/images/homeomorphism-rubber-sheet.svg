<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- 标题 -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    同胚变换：橡皮膜几何
  </text>
  
  <!-- 左侧：咖啡杯 -->
  <g transform="translate(100, 150)">
    <!-- 杯身 -->
    <path d="M 0,0 L 0,80 Q 0,100 20,100 L 60,100 Q 80,100 80,80 L 80,0 Z" 
          fill="#e8f4f8" stroke="#3498db" stroke-width="3"/>
    <!-- 杯把手 -->
    <path d="M 80,20 Q 110,20 110,50 Q 110,80 80,80" 
          fill="none" stroke="#3498db" stroke-width="3"/>
    <!-- 标签 -->
    <text x="40" y="140" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50">
      咖啡杯
    </text>
  </g>
  
  <!-- 中间：变形箭头 -->
  <g transform="translate(280, 200)">
    <path d="M 0,0 L 150,0" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="75" y="-15" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e74c3c">
      连续变形
    </text>
    <text x="75" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
      (拉伸、弯曲、扭曲)
    </text>
  </g>
  
  <!-- 右侧：甜甜圈(圆环面) -->
  <g transform="translate(550, 150)">
    <!-- 外圆 -->
    <ellipse cx="60" cy="50" rx="60" ry="50" fill="#fef5e7" stroke="#f39c12" stroke-width="3"/>
    <!-- 内圆(孔) -->
    <ellipse cx="60" cy="50" rx="20" ry="18" fill="#ffffff" stroke="#f39c12" stroke-width="3"/>
    <!-- 立体感线条 -->
    <path d="M 20,30 Q 60,20 100,30" fill="none" stroke="#f39c12" stroke-width="1.5" opacity="0.5"/>
    <path d="M 20,70 Q 60,80 100,70" fill="none" stroke="#f39c12" stroke-width="1.5" opacity="0.5"/>
    <!-- 标签 -->
    <text x="60" y="140" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50">
      甜甜圈(圆环面)
    </text>
  </g>
  
  <!-- 底部说明 -->
  <g transform="translate(100, 350)">
    <rect x="0" y="0" width="600" height="120" fill="#f8f9fa" stroke="#95a5a6" stroke-width="2" rx="10"/>
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      同胚的核心思想
    </text>
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      • 同胚变换允许：拉伸、弯曲、扭曲（连续变形）
    </text>
    <text x="20" y="85" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      • 同胚变换禁止：撕裂、粘合、穿孔（破坏拓扑结构）
    </text>
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      • 拓扑不变量：孔洞数量、连通性、紧致性等（在同胚下保持不变）
    </text>
  </g>
  
  <!-- 类比说明 -->
  <text x="400" y="490" font-family="Arial, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#7f8c8d">
    现实类比：橡皮膜可以任意拉伸变形，但不能撕破或粘合——这就是拓扑学研究的"形状等价"
  </text>
</svg>
