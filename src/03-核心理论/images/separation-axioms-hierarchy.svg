<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 标题 -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    分离公理层次：从 T₀ 到 T₄
  </text>
  
  <!-- T4 框 -->
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="200" height="70" fill="#e8f8f5" stroke="#1abc9c" stroke-width="3" rx="8"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#16a085">
      T₄ (正规空间)
    </text>
    <text x="100" y="48" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
      不相交闭集可分离
    </text>
  </g>
  
  <!-- T3 框 -->
  <g transform="translate(300, 180)">
    <rect x="0" y="0" width="200" height="70" fill="#fef5e7" stroke="#f39c12" stroke-width="3" rx="8"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#e67e22">
      T₃ (正则空间)
    </text>
    <text x="100" y="48" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
      点与闭集可分离
    </text>
  </g>
  
  <!-- T2 框 -->
  <g transform="translate(300, 280)">
    <rect x="0" y="0" width="200" height="70" fill="#fadbd8" stroke="#e74c3c" stroke-width="3" rx="8"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#c0392b">
      T₂ (Hausdorff)
    </text>
    <text x="100" y="48" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
      不同点可用不相交邻域分离
    </text>
  </g>
  
  <!-- T1 框 -->
  <g transform="translate(300, 380)">
    <rect x="0" y="0" width="200" height="70" fill="#e8daef" stroke="#9b59b6" stroke-width="3" rx="8"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#8e44ad">
      T₁ 空间
    </text>
    <text x="100" y="48" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
      单点集是闭集
    </text>
  </g>
  
  <!-- T0 框 -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="200" height="70" fill="#d5f4e6" stroke="#27ae60" stroke-width="3" rx="8"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#229954">
      T₀ 空间
    </text>
    <text x="100" y="48" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
      不同点可被开集区分
    </text>
  </g>
  
  <!-- 蕴含箭头 -->
  <g>
    <!-- T4 -> T3 -->
    <path d="M 400,150 L 400,180" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)"/>
    <!-- T3 -> T2 -->
    <path d="M 400,250 L 400,280" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)"/>
    <!-- T2 -> T1 -->
    <path d="M 400,350 L 400,380" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)"/>
    <!-- T1 -> T0 -->
    <path d="M 400,450 L 400,480" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- 右侧说明 -->
  <g transform="translate(550, 100)">
    <rect x="0" y="0" width="220" height="420" fill="#f8f9fa" stroke="#95a5a6" stroke-width="2" rx="8"/>
    <text x="110" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      现实类比
    </text>
    
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="13" fill="#16a085" font-weight="bold">T₄ 正规空间：</text>
    <text x="15" y="85" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      像"城市规划"——两块禁区
    </text>
    <text x="15" y="100" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      可以用缓冲带完全隔离
    </text>
    
    <text x="15" y="135" font-family="Arial, sans-serif" font-size="13" fill="#e67e22" font-weight="bold">T₃ 正则空间：</text>
    <text x="15" y="155" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      像"社交距离"——一个人
    </text>
    <text x="15" y="170" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      和一个群体可以保持距离
    </text>
    
    <text x="15" y="205" font-family="Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="bold">T₂ Hausdorff：</text>
    <text x="15" y="225" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      像"个人空间"——任意两人
    </text>
    <text x="15" y="240" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      都能保持互不干扰的距离
    </text>
    
    <text x="15" y="275" font-family="Arial, sans-serif" font-size="13" fill="#8e44ad" font-weight="bold">T₁ 空间：</text>
    <text x="15" y="295" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      像"身份识别"——每个人都
    </text>
    <text x="15" y="310" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      可以被单独"圈出来"
    </text>
    
    <text x="15" y="345" font-family="Arial, sans-serif" font-size="13" fill="#229954" font-weight="bold">T₀ 空间：</text>
    <text x="15" y="365" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      像"基本区分"——任意两人
    </text>
    <text x="15" y="380" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      至少有一个能被区分开来
    </text>
    
    <text x="110" y="410" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#7f8c8d">
      度量空间满足所有 T₄ 公理
    </text>
  </g>
  
  <!-- 左侧关键定理 -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="220" height="300" fill="#fff5e6" stroke="#f39c12" stroke-width="2" rx="8"/>
    <text x="110" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      关键定理
    </text>
    
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="12" fill="#34495e" font-weight="bold">Urysohn 引理：</text>
    <text x="15" y="85" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      T₄ 空间中，不相交闭集
    </text>
    <text x="15" y="100" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      可用连续函数分离
    </text>
    <text x="15" y="115" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      (f: X → [0,1])
    </text>
    
    <text x="15" y="150" font-family="Arial, sans-serif" font-size="12" fill="#34495e" font-weight="bold">Tietze 扩张定理：</text>
    <text x="15" y="170" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      T₄ 空间的闭子集上的
    </text>
    <text x="15" y="185" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      连续函数可扩张到全空间
    </text>
    
    <text x="15" y="220" font-family="Arial, sans-serif" font-size="12" fill="#34495e" font-weight="bold">度量空间：</text>
    <text x="15" y="240" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      所有度量空间都是 T₄
    </text>
    <text x="15" y="255" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      (正规 Hausdorff 空间)
    </text>
    
    <text x="15" y="285" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#7f8c8d">
      分离性越强，空间越"好"
    </text>
  </g>
</svg>
