 <!-- X axis label -->
 <text x="265" y="318" text-anchor="middle" font-size="12" fill="#333333">n</text>

 <!-- Legend -->
 <rect x="100" y="335" width="14" height="10" fill="#ed7d31" stroke="#c45911"/>
 <text x="118" y="344" font-size="10" fill="#333333">素数 p：φ(p) = p-1（最大值）</text>

 <rect x="300" y="335" width="14" height="10" fill="#5b9bd5" stroke="#4c72b0"/>
 <text x="318" y="344" font-size="10" fill="#333333">合数 n：φ(n) &lt; n-1（素因子越多越小）</text>
</svg>
