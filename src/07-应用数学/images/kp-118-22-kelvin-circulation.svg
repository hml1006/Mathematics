   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC', 'WenQuanYi Zen Hei', sans-serif; text-anchor: middle; fill: #666666" x="296.1432" y="177.998596" transform="rotate(-0 296.1432 177.998596)">随流体运动</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'Noto Sans CJK SC', 'WenQuanYi Zen Hei', sans-serif; text-anchor: middle; fill: #666666" x="296.1432" y="204.617008" transform="rotate(-0 296.1432 204.617008)">并发生剪切变形</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'Noto Sans CJK SC', 'WenQuanYi Zen Hei', sans-serif; text-anchor: middle; fill: #55a868" x="455.3568" y="106.273904" transform="rotate(-0 455.3568 106.273904)">t = T：被拉长，环量不变</text>
   </g>
