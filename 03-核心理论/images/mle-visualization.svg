<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="likeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4A90D9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#4A90D9" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">最大似然估计 (MLE)：找到最可能产生数据的参数</text>
  <text x="350" y="52" text-anchor="middle" font-size="13" fill="#7f8c8d">像侦探一样：从"犯罪现场"(数据)反推"嫌疑人"(参数)的最可能值</text>

  <!-- Left panel: Data histogram + fitted curve -->
  <g transform="translate(40, 70)">
    <text x="150" y="15" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">观测数据 (样本)</text>

    <!-- Axes -->
    <line x1="30" y1="250" x2="300" y2="250" stroke="#333" stroke-width="1.5"/>
    <line x1="30" y1="40" x2="30" y2="250" stroke="#333" stroke-width="1.5"/>
    <text x="165" y="275" text-anchor="middle" font-size="12" fill="#555">数据值 x</text>
    <text x="12" y="145" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90, 12, 145)">频数</text>

    <!-- Histogram bars -->
    <rect x="45" y="200" width="25" height="50" fill="#a5d6a7" stroke="#66bb6a" stroke-width="1" rx="2"/>
    <rect x="75" y="160" width="25" height="90" fill="#a5d6a7" stroke="#66bb6a" stroke-width="1" rx="2"/>
    <rect x="105" y="100" width="25" height="150" fill="#81c784" stroke="#66bb6a" stroke-width="1" rx="2"/>
    <rect x="135" y="60" width="25" height="190" fill="#66bb6a" stroke="#43a047" stroke-width="1.5" rx="2"/>
    <rect x="165" y="80" width="25" height="170" fill="#81c784" stroke="#66bb6a" stroke-width="1" rx="2"/>
    <rect x="195" y="140" width="25" height="110" fill="#a5d6a7" stroke="#66bb6a" stroke-width="1" rx="2"/>
    <rect x="225" y="185" width="25" height="65" fill="#a5d6a7" stroke="#66bb6a" stroke-width="1" rx="2"/>
    <rect x="255" y="215" width="25" height="35" fill="#c8e6c9" stroke="#a5d6a7" stroke-width="1" rx="2"/>

    <!-- Fitted normal curve -->
    <path d="M 35,245 Q 60,230 80,195 Q 100,140 120,90 Q 135,55 150,48 Q 165,55 180,90 Q 200,140 220,185 Q 240,215 260,235 Q 280,248 295,250" fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="6,3"/>

    <!-- Mean line -->
    <line x1="148" y1="45" x2="148" y2="250" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="148" y="260" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold">x̄ = μ̂</text>
  </g>

  <!-- Right panel: Likelihood function -->
  <g transform="translate(370, 70)">
    <text x="150" y="15" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">似然函数 L(μ | 数据)</text>

    <!-- Axes -->
    <line x1="30" y1="250" x2="300" y2="250" stroke="#333" stroke-width="1.5"/>
    <line x1="30" y1="40" x2="30" y2="250" stroke="#333" stroke-width="1.5"/>
    <text x="165" y="275" text-anchor="middle" font-size="12" fill="#555">参数 μ</text>
    <text x="12" y="145" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90, 12, 145)">L(μ)</text>

    <!-- Likelihood curve (bell-shaped, centered at MLE) -->
    <path d="M 35,248 Q 60,245 80,235 Q 100,215 120,170 Q 135,100 150,50 Q 165,100 180,170 Q 200,215 220,235 Q 240,245 260,248 Q 280,250 295,250" fill="url(#likeGrad)" stroke="#4A90D9" stroke-width="2.5"/>

    <!-- MLE peak marker -->
    <line x1="150" y1="48" x2="150" y2="250" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
    <circle cx="150" cy="48" r="6" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="150" y="260" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold">μ̂_MLE</text>

    <!-- Arrow pointing to peak -->
    <text x="210" y="65" font-size="12" fill="#e74c3c" font-weight="bold">← 最大值点</text>
    <text x="210" y="82" font-size="11" fill="#555">使数据出现</text>
    <text x="210" y="97" font-size="11" fill="#555">概率最大的 μ</text>
  </g>

  <!-- Connecting arrow between panels -->
  <text x="340" y="200" font-size="28" fill="#4A90D9">→</text>
  <text x="335" y="225" font-size="11" fill="#7f8c8d" text-anchor="middle">最大化</text>

  <!-- Bottom: Step-by-step -->
  <g transform="translate(30, 360)">
    <rect x="0" y="0" width="640" height="110" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <text x="320" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">MLE 求解三步曲</text>

    <!-- Step 1 -->
    <rect x="15" y="35" width="190" height="65" rx="8" fill="#e3f2fd" stroke="#4A90D9" stroke-width="1.5"/>
    <text x="110" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">① 写似然函数</text>
    <text x="110" y="73" text-anchor="middle" font-size="11" fill="#555">L(θ) = ∏ f(xᵢ; θ)</text>
    <text x="110" y="90" text-anchor="middle" font-size="10" fill="#7f8c8d">"数据在参数θ下</text>
    <text x="110" y="102" text-anchor="middle" font-size="10" fill="#7f8c8d">出现的联合概率"</text>

    <!-- Step 2 -->
    <rect x="225" y="35" width="190" height="65" rx="8" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5"/>
    <text x="320" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">② 取对数求导</text>
    <text x="320" y="73" text-anchor="middle" font-size="11" fill="#555">d ln L(θ) / dθ = 0</text>
    <text x="320" y="90" text-anchor="middle" font-size="10" fill="#7f8c8d">乘积变加法，</text>
    <text x="320" y="102" text-anchor="middle" font-size="10" fill="#7f8c8d">方便求极值</text>

    <!-- Step 3 -->
    <rect x="435" y="35" width="190" height="65" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
    <text x="530" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">③ 解方程得 θ̂</text>
    <text x="530" y="73" text-anchor="middle" font-size="11" fill="#555">θ̂ = argmax L(θ)</text>
    <text x="530" y="90" text-anchor="middle" font-size="10" fill="#7f8c8d">例：正态均值 μ̂ = x̄</text>
    <text x="530" y="102" text-anchor="middle" font-size="10" fill="#7f8c8d">伯努利 p̂ = x̄</text>
  </g>
</svg>
