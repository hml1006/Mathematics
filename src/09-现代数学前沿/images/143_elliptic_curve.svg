<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">椭圆曲线与群律</text>
  
  <!-- 左侧：椭圆曲线图形 -->
  <g transform="translate(200, 300)">
    <!-- 坐标轴 -->
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#95a5a6" stroke-width="1.5"/>
    <line x1="0" y1="-200" x2="0" y2="200" stroke="#95a5a6" stroke-width="1.5"/>
    <text x="155" y="5" font-size="14" fill="#7f8c8d">x</text>
    <text x="5" y="-205" font-size="14" fill="#7f8c8d">y</text>
    
    <!-- 椭圆曲线 y² = x³ - x + 1 -->
    <path d="M -100 0 Q -80 -80 -40 -100 Q 0 -110 20 -80 Q 40 -50 60 -20 Q 80 10 100 50" 
          fill="none" stroke="#e74c3c" stroke-width="3"/>
    <path d="M -100 0 Q -80 80 -40 100 Q 0 110 20 80 Q 40 50 60 20 Q 80 -10 100 -50" 
          fill="none" stroke="#e74c3c" stroke-width="3"/>
    
    <!-- 曲线上的点 -->
    <circle cx="-40" cy="-100" r="6" fill="#3498db"/>
    <circle cx="20" cy="-80" r="6" fill="#3498db"/>
    <circle cx="60" cy="-20" r="6" fill="#3498db"/>
    
    <text x="-55" y="-105" font-size="14" fill="#3498db" font-weight="bold">P</text>
    <text x="30" y="-85" font-size="14" fill="#3498db" font-weight="bold">Q</text>
    <text x="70" y="-25" font-size="14" fill="#3498db" font-weight="bold">R</text>
    
    <!-- 连接线 -->
    <line x1="-40" y1="-100" x2="60" y2="-20" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="20" y1="-80" x2="60" y2="-20" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- 切线示意 -->
    <line x1="-60" y1="-120" x2="-20" y2="-80" stroke="#9b59b6" stroke-width="2"/>
    
    <!-- 曲线方程 -->
    <text x="0" y="180" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">y² = x³ + ax + b</text>
  </g>
  
  <!-- 右侧：群律运算 -->
  <g transform="translate(600, 150)">
    <text x="0" y="0" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">群律运算</text>
    
    <!-- P + Q = R -->
    <rect x="-100" y="20" width="200" height="60" rx="10" fill="#ecf0f1" stroke="#3498db" stroke-width="2"/>
    <text x="0" y="45" font-size="16" text-anchor="middle" fill="#2c3e50">P + Q = R</text>
    <text x="0" y="65" font-size="12" text-anchor="middle" fill="#7f8c8d">弦切法：三点共线</text>
    
    <!-- 2P = R -->
    <rect x="-100" y="100" width="200" height="60" rx="10" fill="#ecf0f1" stroke="#e74c3c" stroke-width="2"/>
    <text x="0" y="125" font-size="16" text-anchor="middle" fill="#2c3e50">2P = P + P</text>
    <text x="0" y="145" font-size="12" text-anchor="middle" fill="#7f8c8d">切线法：倍点运算</text>
    
    <!-- 单位元 -->
    <rect x="-100" y="180" width="200" height="60" rx="10" fill="#ecf0f1" stroke="#27ae60" stroke-width="2"/>
    <text x="0" y="205" font-size="16" text-anchor="middle" fill="#2c3e50">O (无穷远点)</text>
    <text x="0" y="225" font-size="12" text-anchor="middle" fill="#7f8c8d">单位元：P + O = P</text>
  </g>
  
  <!-- 底部：关键性质 -->
  <g transform="translate(400, 480)">
    <rect x="-350" y="-30" width="700" height="80" rx="10" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <text x="0" y="-5" font-size="16" text-anchor="middle" fill="#856404" font-weight="bold">椭圆曲线的关键性质</text>
    <text x="-200" y="20" font-size="13" text-anchor="middle" fill="#856404">•  Abel群结构</text>
    <text x="0" y="20" font-size="13" text-anchor="middle" fill="#856404">•  判别式 Δ ≠ 0</text>
    <text x="200" y="20" font-size="13" text-anchor="middle" fill="#856404">•  j-不变量分类</text>
  </g>
  
  <!-- 左上角：Weierstrass方程 -->
  <g transform="translate(150, 80)">
    <rect x="-100" y="-25" width="200" height="50" rx="8" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
    <text x="0" y="-5" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">Weierstrass方程</text>
    <text x="0" y="15" font-size="12" text-anchor="middle" fill="#34495e">y² = x³ + ax + b</text>
  </g>
</svg>
