      <tspan x="68.999268" y="-0.265625" style="font-size: 11.5px; font-family: 'Noto Sans CJK SC'; fill: #222222">足</tspan>
      <tspan x="80.499146" y="-0.265625" style="font-size: 11.5px; font-family: 'Noto Sans CJK SC'; fill: #222222">固</tspan>
      <tspan x="91.999023" y="-0.265625" style="font-size: 11.5px; font-family: 'Noto Sans CJK SC'; fill: #222222">定</tspan>
      <tspan x="103.498901" y="-0.265625" style="font-size: 11.5px; font-family: 'Noto Sans CJK SC'; fill: #222222">规</tspan>
      <tspan x="114.998779" y="-0.265625" style="font-size: 11.5px; font-family: 'Noto Sans CJK SC'; fill: #222222">则</tspan>
      <tspan x="126.498657" y="-0.265625" style="font-size: 11.5px; font-family: 'Noto Sans CJK SC'; fill: #222222">的</tspan>
      <tspan x="137.998535" y="-0.265625" style="font-size: 11.5px; font-family: 'Noto Sans CJK SC'; fill: #222222">算</tspan>
