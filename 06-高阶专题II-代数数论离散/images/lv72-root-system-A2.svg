<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2471a3"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e8449"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="420" fill="#fdfefe" rx="8"/>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#1a1a2e">A₂ 根系与 Dynkin 图</text>
  
  <!-- Root system A2 -->
  <!-- Axes (faint) -->
  <line x1="100" y1="210" x2="420" y2="210" stroke="#ddd" stroke-width="0.5"/>
  <line x1="260" y1="60" x2="260" y2="360" stroke="#ddd" stroke-width="0.5"/>
  
  <!-- 6 roots of A2 -->
  <!-- α₁ = (1, 0) direction -->
  <line x1="260" y1="210" x2="380" y2="210" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <line x1="260" y1="210" x2="140" y2="210" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowR)"/>
  
  <!-- α₂ = (-1/2, √3/2) direction -->
  <line x1="260" y1="210" x2="200" y2="106" stroke="#2471a3" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <line x1="260" y1="210" x2="320" y2="314" stroke="#2471a3" stroke-width="2.5" marker-end="url(#arrowB)"/>
  
  <!-- α₁+α₂ = (1/2, √3/2) direction -->
  <line x1="260" y1="210" x2="320" y2="106" stroke="#1e8449" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <line x1="260" y1="210" x2="200" y2="314" stroke="#1e8449" stroke-width="2.5" marker-end="url(#arrowG)"/>
  
  <!-- Root labels -->
  <text x="390" y="215" font-family="serif" font-size="14" fill="#c0392b" font-style="italic">α₁</text>
  <text x="118" y="215" font-family="serif" font-size="14" fill="#c0392b" font-style="italic">−α₁</text>
  <text x="185" y="98" font-family="serif" font-size="14" fill="#2471a3" font-style="italic">α₂</text>
  <text x="325" y="330" font-family="serif" font-size="14" fill="#2471a3" font-style="italic">−α₂</text>
  <text x="328" y="98" font-family="serif" font-size="14" fill="#1e8449" font-style="italic">α₁+α₂</text>
  <text x="170" y="330" font-family="serif" font-size="14" fill="#1e8449" font-style="italic">−(α₁+α₂)</text>
  
  <!-- Origin -->
  <circle cx="260" cy="210" r="3" fill="#333"/>
  
  <!-- Angle labels -->
  <text x="290" y="195" font-family="serif" font-size="11" fill="#666">120°</text>
  <text x="225" y="175" font-family="serif" font-size="11" fill="#666">60°</text>
  
  <!-- Weyl chamber (fundamental domain) -->
  <line x1="260" y1="210" x2="350" y2="130" stroke="#8e44ad" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="260" y1="210" x2="260" y2="90" stroke="#8e44ad" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="275" y="145" font-family="serif" font-size="11" fill="#8e44ad">Weyl 腔</text>
  
  <!-- Dynkin diagram -->
  <text x="480" y="100" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#333">Dynkin 图 A₂</text>
  
  <!-- Node 1 -->
  <circle cx="450" cy="150" r="14" fill="white" stroke="#c0392b" stroke-width="2.5"/>
  <text x="450" y="155" text-anchor="middle" font-family="serif" font-size="12" fill="#c0392b" font-style="italic">α₁</text>
  
  <!-- Node 2 -->
  <circle cx="520" cy="150" r="14" fill="white" stroke="#2471a3" stroke-width="2.5"/>
  <text x="520" y="155" text-anchor="middle" font-family="serif" font-size="12" fill="#2471a3" font-style="italic">α₂</text>
  
  <!-- Edge -->
  <line x1="464" y1="150" x2="506" y2="150" stroke="#333" stroke-width="2"/>
  
  <!-- Classification list -->
  <text x="480" y="210" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="#333">分类</text>
  <text x="430" y="235" font-family="serif" font-size="12" fill="#555">Aₙ: 𝔰𝔩(n+1)</text>
  <text x="430" y="255" font-family="serif" font-size="12" fill="#555">Bₙ: 𝔰𝔬(2n+1)</text>
  <text x="430" y="275" font-family="serif" font-size="12" fill="#555">Cₙ: 𝔰𝔭(2n)</text>
  <text x="430" y="295" font-family="serif" font-size="12" fill="#555">Dₙ: 𝔰𝔬(2n)</text>
  <text x="430" y="315" font-family="serif" font-size="12" fill="#555">E₆, E₇, E₈</text>
  <text x="430" y="335" font-family="serif" font-size="12" fill="#555">F₄, G₂</text>
  
  <!-- Caption -->
  <text x="300" y="395" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">A₂ 根系：6 个根互成 60°/120°，单根 α₁, α₂ 生成整个根系</text>
  <text x="300" y="412" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Weyl 反射 s_{α}(λ) = λ − 2⟨λ,α⟩/⟨α,α⟩ · α 保持根系不变</text>
</svg>
