<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- 圆 -->
  <circle cx="250" cy="200" r="150" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>

  <!-- 圆心 O -->
  <circle cx="250" cy="200" r="4" fill="#c62828"/>
  <text x="260" y="195" font-size="14" font-weight="bold" fill="#c62828">O</text>

  <!-- 半径 r（端点(379.9,125)在圆上） -->
  <line x1="250" y1="200" x2="379.9" y2="125" stroke="#c62828" stroke-width="2"/>
  <text x="325" y="155" font-size="13" fill="#c62828" font-weight="bold">r</text>

  <!-- 直径 d -->
  <line x1="100" y1="200" x2="400" y2="200" stroke="#2e7d32" stroke-width="2.5"/>
  <circle cx="100" cy="200" r="3" fill="#2e7d32"/>
  <circle cx="400" cy="200" r="3" fill="#2e7d32"/>
  <text x="245" y="218" font-size="13" fill="#2e7d32" font-weight="bold">d = 2r</text>

  <!-- 弦（端点(120.1,275)和(379.9,275)在圆上） -->
  <line x1="120.1" y1="275" x2="379.9" y2="275" stroke="#e65100" stroke-width="2"/>
  <circle cx="120.1" cy="275" r="3" fill="#e65100"/>
  <circle cx="379.9" cy="275" r="3" fill="#e65100"/>
  <text x="250" y="295" font-size="13" fill="#e65100" font-weight="bold">弦</text>

  <!-- 弧 -->
  <path d="M 120.1,275 A 150,150 0 0,1 379.9,275" fill="none" stroke="#7b1fa2" stroke-width="3"/>
  <text x="250" y="345" font-size="13" fill="#7b1fa2" font-weight="bold">弧</text>

  <!-- 圆心角 -->
  <line x1="250" y1="200" x2="120.1" y2="275" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="250" y1="200" x2="379.9" y2="275" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M 230,215 A 30,30 0 0,0 270,215" fill="none" stroke="#1565c0" stroke-width="2"/>
  <text x="250" y="240" font-size="12" fill="#1565c0" font-weight="bold">圆心角</text>

  <!-- 圆周角（顶点(325,70.1)在圆上） -->
  <circle cx="325" cy="70.1" r="4" fill="#c62828"/>
  <line x1="325" y1="70.1" x2="120.1" y2="275" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="325" y1="70.1" x2="379.9" y2="275" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M 315,85 A 20,20 0 0,0 335,85" fill="none" stroke="#c62828" stroke-width="2"/>
  <text x="325" y="60" font-size="12" fill="#c62828" font-weight="bold">圆周角</text>
</svg>