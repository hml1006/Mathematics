<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">算术几何前沿：p-adic世界</text>
  
  <!-- 左侧：Weil猜想 -->
  <g transform="translate(200, 200)">
    <text x="0" y="-80" font-size="18" font-weight="bold" text-anchor="middle" fill="#e74c3c">Weil猜想</text>
    
    <!-- Zeta函数 -->
    <rect x="-100" y="-50" width="200" height="80" rx="10" fill="#e74c3c" fill-opacity="0.15" stroke="#e74c3c" stroke-width="2"/>
    <text x="0" y="-25" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">Z(X, t)</text>
    <text x="0" y="-5" font-size="12" text-anchor="middle" fill="#c0392b">= exp(Σ|X(F_qⁿ)|tⁿ/n)</text>
    <text x="0" y="15" font-size="12" text-anchor="middle" fill="#c0392b">有理性 • 函数方程</text>
    
    <text x="0" y="50" font-size="12" text-anchor="middle" fill="#7f8c8d">计数问题 → 上同调</text>
  </g>
  
  <!-- 中间：p-adic Hodge理论 -->
  <g transform="translate(400, 200)">
    <text x="0" y="-80" font-size="18" font-weight="bold" text-anchor="middle" fill="#3498db">p-adic Hodge理论</text>
    
    <!-- 比较定理 -->
    <rect x="-100" y="-50" width="200" height="80" rx="10" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="2"/>
    <text x="0" y="-25" font-size="13" text-anchor="middle" fill="#2980b9" font-weight="bold">比较同构</text>
    <text x="0" y="-5" font-size="11" text-anchor="middle" fill="#2980b9">H_et ⊗ B_dR ≅</text>
    <text x="0" y="10" font-size="11" text-anchor="middle" fill="#2980b9">H_dR ⊗ B_dR</text>
    
    <text x="0" y="50" font-size="12" text-anchor="middle" fill="#7f8c8d">连接不同上同调</text>
  </g>
  
  <!-- 右侧：Perfectoid空间 -->
  <g transform="translate(600, 200)">
    <text x="0" y="-80" font-size="18" font-weight="bold" text-anchor="middle" fill="#9b59b6">Perfectoid空间</text>
    
    <!-- Tilting对应 -->
    <rect x="-100" y="-50" width="200" height="80" rx="10" fill="#9b59b6" fill-opacity="0.15" stroke="#9b59b6" stroke-width="2"/>
    <text x="0" y="-25" font-size="14" text-anchor="middle" fill="#8e44ad" font-weight="bold">Tilting对应</text>
    <text x="0" y="-5" font-size="12" text-anchor="middle" fill="#8e44ad">特征0 ↔ 特征p</text>
    <text x="0" y="15" font-size="12" text-anchor="middle" fill="#8e44ad">X_ét ≅ X^♭_ét</text>
    
    <text x="0" y="50" font-size="12" text-anchor="middle" fill="#7f8c8d">Scholze的突破</text>
  </g>
  
  <!-- 底部：Fargues-Fontaine曲线 -->
  <g transform="translate(400, 400)">
    <rect x="-350" y="-40" width="700" height="100" rx="10" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    
    <text x="0" y="-15" font-size="16" font-weight="bold" text-anchor="middle" fill="#856404">Fargues-Fontaine曲线</text>
    
    <text x="-200" y="10" font-size="13" text-anchor="middle" fill="#856404">• p-adic P¹类比</text>
    <text x="0" y="10" font-size="13" text-anchor="middle" fill="#856404">• 向量丛分类</text>
    <text x="200" y="10" font-size="13" text-anchor="middle" fill="#856404">• p-adic Langlands</text>
    
    <text x="0" y="35" font-size="13" text-anchor="middle" fill="#856404">X = Proj(⊕ B_cris^{φ=pⁿ})</text>
  </g>
  
  <!-- 顶部：核心联系 -->
  <g transform="translate(400, 100)">
    <rect x="-300" y="-25" width="600" height="50" rx="8" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
    <text x="0" y="0" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">算术几何的核心联系</text>
    <text x="0" y="20" font-size="12" text-anchor="middle" fill="#34495e">数论（Galois表示）↔ 几何（代数簇）↔ 分析（p-adic方法）</text>
  </g>
</svg>
