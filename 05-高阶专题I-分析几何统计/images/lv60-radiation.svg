<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="radGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    积分方程与辐射传热：Fredholm 方程描述能量交换
  </text>
  
  <!-- Physical setup: radiating surfaces -->
  <g transform="translate(50, 60)">
    <text x="350" y="0" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e" font-weight="bold">辐射传热：表面间的能量交换</text>
    
    <!-- Surface 1 (hot) -->
    <rect x="20" y="40" width="30" height="200" fill="#e74c3c" opacity="0.7" rx="3"/>
    <text x="35" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">T₁ (热源)</text>
    
    <!-- Surface 2 (cold) -->
    <rect x="650" y="40" width="30" height="200" fill="#3498db" opacity="0.7" rx="3"/>
    <text x="665" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#3498db">T₂ (冷源)</text>
    
    <!-- Radiation rays between surfaces -->
    <line x1="50" y1="80" x2="650" y2="100" stroke="#f39c12" stroke-width="1" opacity="0.5"/>
    <line x1="50" y1="120" x2="650" y2="150" stroke="#f39c12" stroke-width="1.2" opacity="0.6"/>
    <line x1="50" y1="160" x2="650" y2="180" stroke="#f39c12" stroke-width="1.5" opacity="0.7"/>
    <line x1="50" y1="200" x2="650" y2="200" stroke="#f39c12" stroke-width="1.5" opacity="0.7"/>
    <line x1="50" y1="180" x2="650" y2="120" stroke="#f39c12" stroke-width="1.2" opacity="0.6"/>
    <line x1="50" y1="100" x2="650" y2="180" stroke="#f39c12" stroke-width="1" opacity="0.5"/>
    
    <!-- View factor annotation -->
    <text x="350" y="260" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">角系数 F(x,y)：表面 x 发出的辐射到达表面 y 的比例</text>
    
    <!-- Participating medium -->
    <rect x="80" y="50" width="540" height="180" fill="#f39c12" opacity="0.05" rx="4" stroke="#f39c12" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="350" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#f39c12" opacity="0.7">参与性介质（吸收/发射/散射）</text>
  </g>
  
  <!-- Fredholm integral equation -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="700" height="180" fill="#ecf0f1" rx="8" stroke="#e67e22" stroke-width="1.5"/>
    
    <text x="350" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">辐射传热积分方程</text>
    
    <!-- Equation -->
    <text x="350" y="55" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#34495e">
      q(x) = ε(x)σT⁴(x) - ε(x)∫ K(x,y) q(y) dy
    </text>
    
    <!-- Explanation -->
    <text x="30" y="85" font-family="Arial, sans-serif" font-size="11" fill="#34495e" font-weight="bold">各项含义：</text>
    <text x="30" y="105" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">q(x)：表面 x 处的净热流密度（未知函数）</text>
    <text x="30" y="125" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">ε(x)σT⁴(x)：表面 x 自身的发射功率（已知源项 f(x)）</text>
    <text x="30" y="145" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">K(x,y)：角系数核（Fredholm 核），描述 y 对 x 的辐射贡献</text>
    <text x="30" y="165" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">∫K(x,y)q(y)dy：表面 x 接收到的来自所有其他表面的辐射（积分项）</text>
  </g>
</svg>
