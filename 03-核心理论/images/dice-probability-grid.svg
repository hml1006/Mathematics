      <rect x="70" y="100" width="50" height="50" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
      <text x="95" y="132" fill="#e65100">4</text>
      <rect x="130" y="100" width="50" height="50" rx="6" fill="#fce4ec" stroke="#f48fb1" stroke-width="1.5"/>
      <text x="155" y="132" fill="#c2185b">5</text>
      <rect x="190" y="100" width="50" height="50" rx="6" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
      <text x="215" y="132" fill="#7b1fa2">6</text>
      <rect x="250" y="100" width="50" height="50" rx="6" fill="#fff9c4" stroke="#fff176" stroke-width="1.5"/>
      <text x="275" y="132" fill="#f57f17">7</text>
      <rect x="310" y="100" width="50" height="50" rx="6" fill="#e0f7fa" stroke="#80deea" stroke-width="1.5"/>
      <text x="335" y="132" fill="#00838f">8</text>
      <!-- Row 3 -->
      <rect x="10" y="160" width="50" height="50" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
      <text x="35" y="192" fill="#e65100">4</text>
      <rect x="70" y="160" width="50" height="50" rx="6" fill="#fce4ec" stroke="#f48fb1" stroke-width="1.5"/>
