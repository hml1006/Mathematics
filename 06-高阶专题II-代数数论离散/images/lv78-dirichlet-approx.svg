<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430">
  <!-- Background -->
  <rect width="620" height="430" fill="#eaf2f8" rx="8"/>
  
  <!-- Title -->
  <text x="310" y="30" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#1a1a2e">Dirichlet 逼近定理：鸽巢原理的威力</text>
  
  <!-- Pigeonhole illustration -->
  <g transform="translate(40, 55)">
    <text x="130" y="0" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="#333">鸽巢原理示意</text>
    
    <!-- Unit interval divided into N parts -->
    <rect x="10" y="20" width="240" height="30" fill="#f9f9f9" stroke="#666" stroke-width="1"/>
    
    <!-- Divisions -->
    <line x1="34" y1="20" x2="34" y2="50" stroke="#999" stroke-width="0.5"/>
    <line x1="58" y1="20" x2="58" y2="50" stroke="#999" stroke-width="0.5"/>
    <line x1="82" y1="20" x2="82" y2="50" stroke="#999" stroke-width="0.5"/>
    <line x1="106" y1="20" x2="106" y2="50" stroke="#999" stroke-width="0.5"/>
    <line x1="130" y1="20" x2="130" y2="50" stroke="#999" stroke-width="0.5"/>
    <line x1="154" y1="20" x2="154" y2="50" stroke="#999" stroke-width="0.5"/>
    <line x1="178" y1="20" x2="178" y2="50" stroke="#999" stroke-width="0.5"/>
    <line x1="202" y1="20" x2="202" y2="50" stroke="#999" stroke-width="0.5"/>
    <line x1="226" y1="20" x2="226" y2="50" stroke="#999" stroke-width="0.5"/>
    
    <!-- Labels -->
    <text x="10" y="65" font-family="serif" font-size="10" fill="#666">0</text>
    <text x="248" y="65" font-family="serif" font-size="10" fill="#666">1</text>
    <text x="130" y="65" font-family="serif" font-size="10" fill="#666">N 等分</text>
    
    <!-- Points {kα} -->
    <circle cx="25" cy="35" r="4" fill="#c0392b"/>
    <text x="25" y="15" text-anchor="middle" font-family="serif" font-size="9" fill="#c0392b">0</text>
    
    <circle cx="70" cy="35" r="4" fill="#2471a3"/>
    <text x="70" y="15" text-anchor="middle" font-family="serif" font-size="9" fill="#2471a3">{α}</text>
    
    <circle cx="115" cy="35" r="4" fill="#1e8449"/>
    <text x="115" y="15" text-anchor="middle" font-family="serif" font-size="9" fill="#1e8449">{2α}</text>
    
    <circle cx="160" cy="35" r="4" fill="#8e44ad"/>
    <text x="160" y="15" text-anchor="middle" font-family="serif" font-size="9" fill="#8e44ad">{3α}</text>
    
    <circle cx="205" cy="35" r="4" fill="#e67e22"/>
    <text x="205" y="15" text-anchor="middle" font-family="serif" font-size="9" fill="#e67e22">{4α}</text>
    
    <circle cx="240" cy="35" r="4" fill="#c0392b"/>
    <text x="240" y="15" text-anchor="middle" font-family="serif" font-size="9" fill="#c0392b">{5α}</text>
    
    <!-- Two points in same interval -->
    <rect x="100" y="20" width="24" height="30" fill="#fadbd8" fill-opacity="0.5" stroke="#c0392b" stroke-width="1.5"/>
    <text x="112" y="85" text-anchor="middle" font-family="serif" font-size="10" fill="#c0392b">同一区间！</text>
    <text x="112" y="98" text-anchor="middle" font-family="serif" font-size="10" fill="#c0392b">|{jα}−{iα}| &lt; 1/N</text>
  </g>
  
  <!-- Theorem box -->
  <rect x="340" y="55" width="260" height="110" rx="8" fill="white" stroke="#2471a3" stroke-width="2"/>
  <text x="470" y="80" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="#2471a3">Dirichlet 逼近定理</text>
  <text x="470" y="105" text-anchor="middle" font-family="serif" font-size="12" fill="#1a1a2e">∀α∈ℝ, N∈ℕ⁺, ∃p,q∈ℤ</text>
  <text x="470" y="125" text-anchor="middle" font-family="serif" font-size="12" fill="#1a1a2e">1 ≤ q ≤ N, |qα−p| &lt; 1/N</text>
  <text x="470" y="148" text-anchor="middle" font-family="serif" font-size="11" fill="#555">⇒ |α − p/q| &lt; 1/(qN) ≤ 1/q²</text>
  
  <!-- Continued fraction connection -->
  <rect x="40" y="180" width="540" height="90" rx="8" fill="#fef9e7" stroke="#e67e22" stroke-width="2"/>
  <text x="310" y="205" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="#e67e22">连分数给出最佳逼近</text>
  <text x="310" y="228" text-anchor="middle" font-family="serif" font-size="12" fill="#1a1a2e">π = [3; 7, 15, 1, 292, ...] → 3, 22/7, 333/106, 355/113, ...</text>
  <text x="310" y="250" text-anchor="middle" font-family="serif" font-size="11" fill="#555">355/113 ≈ 3.14159292...  误差仅 2.7×10⁻⁷（分母仅 113！）</text>
  <text x="310" y="265" text-anchor="middle" font-family="serif" font-size="10" fill="#888">渐近分数 pₙ/qₙ 是所有分母 ≤ qₙ 的有理数中最接近 α 的</text>
  
  <!-- Roth theorem -->
  <rect x="40" y="285" width="260" height="80" rx="8" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
  <text x="170" y="310" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="#c0392b">Roth 定理 (1955 Fields 奖)</text>
  <text x="170" y="333" text-anchor="middle" font-family="serif" font-size="11" fill="#1a1a2e">α 代数无理数，ε &gt; 0</text>
  <text x="170" y="353" text-anchor="middle" font-family="serif" font-size="11" fill="#1a1a2e">|α − p/q| &lt; 1/q^{2+ε} 仅有限解</text>
  
  <!-- Liouville theorem -->
  <rect x="320" y="285" width="260" height="80" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="450" y="310" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="#1e8449">Liouville 定理</text>
  <text x="450" y="333" text-anchor="middle" font-family="serif" font-size="11" fill="#1a1a2e">α 是 d 次代数无理数</text>
  <text x="450" y="353" text-anchor="middle" font-family="serif" font-size="11" fill="#1a1a2e">|α − p/q| ≥ c(α)/qᵈ</text>
  
  <!-- Bottom: Transcendental numbers -->
  <rect x="40" y="380" width="540" height="40" rx="6" fill="white" stroke="#aaa" stroke-width="1"/>
  <text x="310" y="405" text-anchor="middle" font-family="serif" font-size="12" fill="#1a1a2e">超越数构造：Liouville 数 α = Σ 10^{−n!} 可被有理数"异常好"地逼近 → 超越数</text>
</svg>
