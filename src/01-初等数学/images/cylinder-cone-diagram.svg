<line x1="500.00" y1="318.00" x2="560.00" y2="318.00" style="stroke:#000000; stroke-width:0.50"/>
<text x="530.00" y="332.00" style="font-size:14pt; font-style:italic; fill:#000000" text-anchor="middle">r</text>

<!-- 圆锥体 - 高度标注 -->
<line x1="425.00" y1="300.00" x2="425.00" y2="120.00" style="stroke:#000000; stroke-width:0.50"/>
<text x="415.00" y="210.00" style="font-size:14pt; font-style:italic; fill:#000000" text-anchor="middle">h</text>

<!-- 圆锥体 - 标题 -->
<text x="500.00" y="80.00" style="font-size:16pt; font-weight:bold; fill:#000000" text-anchor="middle">圆锥</text>

<!-- 圆锥体 - 体积公式 -->
<text x="500.00" y="360.00" style="font-size:14pt; fill:#000000" text-anchor="middle">V = ⅓πr²h</text>

