      <rect x="10" y="280" width="50" height="50" rx="6" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
      <text x="35" y="312" fill="#7b1fa2">6</text>
      <rect x="70" y="280" width="50" height="50" rx="6" fill="#fff9c4" stroke="#fff176" stroke-width="1.5"/>
      <text x="95" y="312" fill="#f57f17">7</text>
      <rect x="130" y="280" width="50" height="50" rx="6" fill="#e0f7fa" stroke="#80deea" stroke-width="1.5"/>
