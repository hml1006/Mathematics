<line x1="180.00" y1="318.00" x2="240.00" y2="318.00" style="stroke:#000000; stroke-width:0.50"/>
<text x="210.00" y="332.00" style="font-size:14pt; font-style:italic; fill:#000000" text-anchor="middle">r</text>

<!-- 圆柱体 - 高度标注 -->
<line x1="105.00" y1="300.00" x2="105.00" y2="120.00" style="stroke:#000000; stroke-width:0.50"/>
<text x="95.00" y="210.00" style="font-size:14pt; font-style:italic; fill:#000000" text-anchor="middle">h</text>

<!-- 圆柱体 - 标题 -->
<text x="180.00" y="80.00" style="font-size:16pt; font-weight:bold; fill:#000000" text-anchor="middle">圆柱</text>

<!-- 圆柱体 - 体积公式 -->
<text x="180.00" y="360.00" style="font-size:14pt; fill:#000000" text-anchor="middle">V = πr²h</text>

<!-- 圆锥体 - 填充侧面 -->
<path d="M560.00,300.00 L 440.00,300.00 L 500.00,120.00 z" fill="#FFF3E0" stroke="none"/>

