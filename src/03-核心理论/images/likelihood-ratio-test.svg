<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">似然比检验：比较两个假设的"解释力"</text>
  <text x="350" y="52" text-anchor="middle" font-size="13" fill="#7f8c8d">哪个假设更好地解释了观测到的数据？</text>

  <!-- Top panel: Two distributions -->
  <g transform="translate(40, 75)">
    <text x="310" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">H₀: μ=0 (蓝色) vs H₁: μ=3 (红色)，方差 σ²=1</text>

    <!-- Axes -->
    <line x1="20" y1="160" x2="600" y2="160" stroke="#333" stroke-width="1.5"/>
    <text x="310" y="180" text-anchor="middle" font-size="12" fill="#555">观测值 x</text>

    <!-- H0 distribution (centered at 0, mapped to x=200) -->
    <path d="M 50,158 Q 80,155 110,148 Q 140,135 160,110 Q 175,80 190,55 Q 200,40 210,55 Q 225,80 240,110 Q 260,135 280,148 Q 310,155 340,158" fill="#4A90D9" fill-opacity="0.15" stroke="#4A90D9" stroke-width="2.5"/>
    <text x="210" y="30" text-anchor="middle" font-size="12" fill="#4A90D9" font-weight="bold">f(x; μ=0)</text>

    <!-- H1 distribution (centered at 3, mapped to x=380) -->
    <path d="M 230,158 Q 260,155 290,148 Q 320,135 340,110 Q 355,80 370,55 Q 380,40 390,55 Q 405,80 420,110 Q 440,135 460,148 Q 490,155 520,158" fill="#e74c3c" fill-opacity="0.15" stroke="#e74c3c" stroke-width="2.5"/>
    <text x="390" y="30" text-anchor="middle" font-size="12" fill="#e74c3c" font-weight="bold">f(x; μ=3)</text>

    <!-- Observed data point -->
    <line x1="340" y1="35" x2="340" y2="160" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,3"/>
    <circle cx="340" cy="108" r="5" fill="#e67e22"/>
    <text x="340" y="175" text-anchor="middle" font-size="11" fill="#e67e22" font-weight="bold">x_obs</text>

    <!-- Likelihood ratio arrows -->
    <line x1="340" y1="108" x2="340" y2="55" stroke="#4A90D9" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="355" y="70" font-size="10" fill="#4A90D9">f(x;0)=小</text>

    <line x1="340" y1="108" x2="340" y2="112" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="355" y="125" font-size="10" fill="#e74c3c">f(x;3)=大</text>
  </g>

  <!-- Middle: Likelihood ratio formula -->
  <g transform="translate(150, 270)">
    <rect x="0" y="0" width="400" height="60" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <text x="200" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">似然比 (Likelihood Ratio)</text>
    <text x="200" y="48" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">Λ(x) = sup_{Θ₀} L(θ;x) / sup_{Θ} L(θ;x)</text>
  </g>

  <!-- Bottom: Decision regions -->
  <g transform="translate(40, 350)">
    <text x="310" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">决策规则</text>

    <!-- Number line -->
    <line x1="50" y1="40" x2="570" y2="40" stroke="#333" stroke-width="2"/>

    <!-- Lambda axis -->
    <text x="30" y="45" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">Λ</text>
    <text x="55" y="58" text-anchor="middle" font-size="10" fill="#555">0</text>
    <text x="565" y="58" text-anchor="middle" font-size="10" fill="#555">1</text>

    <!-- Reject region (left) -->
    <rect x="50" y="25" width="150" height="30" rx="5" fill="#e74c3c" fill-opacity="0.3" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="125" y="45" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">拒绝 H₀</text>

    <!-- Accept region (right) -->
    <rect x="200" y="25" width="370" height="30" rx="5" fill="#27ae60" fill-opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="385" y="45" text-anchor="middle" font-size="12" fill="#1b5e20" font-weight="bold">不拒绝 H₀</text>

    <!-- Critical value -->
    <line x1="200" y1="15" x2="200" y2="60" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="200" y="78" text-anchor="middle" font-size="11" fill="#e67e22" font-weight="bold">临界值 c</text>

    <!-- Explanation -->
    <text x="125" y="100" text-anchor="middle" font-size="11" fill="#c0392b">Λ &lt; c → H₀解释力弱</text>
    <text x="385" y="100" text-anchor="middle" font-size="11" fill="#1b5e20">Λ ≥ c → H₀解释力足够</text>

    <!-- Asymptotic note -->
    <rect x="80" y="108" width="460" height="22" rx="5" fill="#e3f2fd" stroke="none"/>
    <text x="310" y="124" text-anchor="middle" font-size="11" fill="#1565c0">大样本下：-2 ln Λ ~ χ²(df)，df = dim(Θ) - dim(Θ₀)</text>
  </g>
</svg>
