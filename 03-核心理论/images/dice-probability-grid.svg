<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="340" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">掷两颗骰子：点数之和的概率分布</text>
  <text x="340" y="58" text-anchor="middle" font-size="13" fill="#7f8c8d">36 种等可能结果 → 钟形分布的雏形</text>

  <!-- 6x6 Grid -->
  <g transform="translate(60, 80)">
    <!-- Column headers (Die 2) -->
    <text x="45" y="-8" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A90D9">骰子B →</text>
    <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
      <rect x="10" y="0" width="50" height="30" rx="4" fill="#4A90D9"/>
      <text x="35" y="21">1</text>
      <rect x="70" y="0" width="50" height="30" rx="4" fill="#4A90D9"/>
      <text x="95" y="21">2</text>
      <rect x="130" y="0" width="50" height="30" rx="4" fill="#4A90D9"/>
      <text x="155" y="21">3</text>
      <rect x="190" y="0" width="50" height="30" rx="4" fill="#4A90D9"/>
      <text x="215" y="21">4</text>
      <rect x="250" y="0" width="50" height="30" rx="4" fill="#4A90D9"/>
      <text x="275" y="21">5</text>
      <rect x="310" y="0" width="50" height="30" rx="4" fill="#4A90D9"/>
      <text x="335" y="21">6</text>
    </g>

    <!-- Row header -->
    <text x="-15" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A90D9" transform="rotate(-90, -15, 170)">骰子A ↓</text>

