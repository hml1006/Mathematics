<?xml version="1.0" encoding="utf-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="400" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">
    Cauchy 积分定理
  </text>
  
  <!-- Domain D - large rounded region -->
  <ellipse cx="250" cy="220" rx="200" ry="140" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="420" y="100" font-family="sans-serif" font-size="16" font-style="italic" fill="#1976d2">D</text>
  <text x="380" y="120" font-family="sans-serif" font-size="11" fill="#1976d2">(单连通区域)</text>
  
  <!-- Closed contour γ -->
  <path d="M 200 180 
           C 180 150, 220 120, 260 130
           C 300 140, 320 170, 310 210
           C 300 250, 260 270, 220 260
           C 180 250, 170 210, 200 180 Z"
        fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- Label for γ -->
  <text x="330" y="140" font-family="sans-serif" font-size="16" font-style="italic" fill="#2e7d32">γ</text>
  
  <!-- Point z₀ inside contour -->
  <circle cx="250" cy="200" r="4" fill="#c44e52"/>
  <text x="260" y="195" font-family="sans-serif" font-size="12" fill="#c44e52">z₀</text>
  
  <!-- Function label -->
  <text x="100" y="80" font-family="sans-serif" font-size="13" fill="#333">
    <tspan font-style="italic">f</tspan>(<tspan font-style="italic">z</tspan>) 在 <tspan font-style="italic">D</tspan> 上全纯
  </text>
  
  <!-- Formula -->
  <rect x="100" y="340" width="300" height="45" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="250" y="365" text-anchor="middle" font-family="serif" font-size="18" fill="#e65100">
    ∮<tspan font-style="italic">γ</tspan> <tspan font-style="italic">f</tspan>(<tspan font-style="italic">z</tspan>) d<tspan font-style="italic">z</tspan> = 0
  </text>
  
  <!-- Annotation -->
  <text x="250" y="395" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">
    闭合路径上的积分 = 0
  </text>
</svg>
