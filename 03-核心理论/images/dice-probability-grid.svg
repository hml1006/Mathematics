      <!-- Row 1 -->
      <rect x="10" y="40" width="50" height="50" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
      <text x="35" y="72" fill="#2e7d32">2</text>
      <rect x="70" y="40" width="50" height="50" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
      <text x="95" y="72" fill="#1565c0">3</text>
      <rect x="130" y="40" width="50" height="50" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
