<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .composite { fill: #3498db; stroke: #2874a6; stroke-width: 2; }
      .prime { fill: #2ecc71; stroke: #27ae60; stroke-width: 3; }
      .line { stroke: #7f8c8d; stroke-width: 2; }
      .label { font-family: 'Arial', sans-serif; font-size: 20px; fill: #2c3e50; font-weight: bold; }
      .title { font-family: 'Arial', sans-serif; font-size: 28px; fill: #2c3e50; font-weight: bold; }
      .formula { font-family: 'Arial', sans-serif; font-size: 24px; fill: #e74c3c; font-weight: bold; }
    </style>
  </defs>
  
  <!-- 标题 -->
  <text x="400" y="35" text-anchor="middle" class="title">质因数分解树：60 = 2² × 3 × 5</text>
  
  <!-- 根节点：60 -->
  <circle cx="400" cy="80" r="35" class="composite"/>
  <text x="400" y="90" text-anchor="middle" class="label" fill="white" font-size="24">60</text>
  
  <!-- 第一层分支 -->
  <line x1="400" y1="115" x2="250" y2="180" class="line"/>
  <line x1="400" y1="115" x2="550" y2="180" class="line"/>
  
  <!-- 第二层：6 和 10 -->
  <circle cx="250" cy="200" r="30" class="composite"/>
  <text x="250" y="210" text-anchor="middle" class="label" fill="white" font-size="20">6</text>
  
  <circle cx="550" cy="200" r="30" class="composite"/>
  <text x="550" y="210" text-anchor="middle" class="label" fill="white" font-size="20">10</text>
  
  <!-- 第二层分支 -->
  <line x1="250" y1="230" x2="150" y2="300" class="line"/>
  <line x1="250" y1="230" x2="350" y2="300" class="line"/>
  
  <line x1="550" y1="230" x2="450" y2="300" class="line"/>
  <line x1="550" y1="230" x2="650" y2="300" class="line"/>
  
  <!-- 第三层：2, 3, 2, 5 -->
  <circle cx="150" cy="320" r="28" class="prime"/>
  <text x="150" y="330" text-anchor="middle" class="label" fill="white" font-size="20">2</text>
  
  <circle cx="350" cy="320" r="28" class="prime"/>
  <text x="350" y="330" text-anchor="middle" class="label" fill="white" font-size="20">3</text>
  
  <circle cx="450" cy="320" r="28" class="prime"/>
  <text x="450" y="330" text-anchor="middle" class="label" fill="white" font-size="20">2</text>
  
  <circle cx="650" cy="320" r="28" class="prime"/>
  <text x="650" y="330" text-anchor="middle" class="label" fill="white" font-size="20">5</text>
  
  <!-- 分解过程说明 -->
  <g transform="translate(50, 400)">
    <rect x="0" y="0" width="700" height="150" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="10"/>
    
    <text x="350" y="30" text-anchor="middle" class="label" font-size="18">分解过程：</text>
    
    <text x="50" y="65" class="label" font-size="16">第 1 步：60 = 6 × 10</text>
    <text x="50" y="95" class="label" font-size="16">第 2 步：6 = 2 × 3，10 = 2 × 5</text>
    <text x="50" y="125" class="label" font-size="16">第 3 步：2, 3, 5 都是质数，分解完成</text>
    
    <text x="450" y="65" class="formula" font-size="20">60 = 2 × 3 × 2 × 5</text>
    <text x="450" y="105" class="formula" font-size="20">= 2² × 3 × 5</text>
  </g>
  
  <!-- 底部说明 -->
  <g transform="translate(100, 570)">
    <rect x="0" y="0" width="600" height="20" fill="#d5f4e6" stroke="#27ae60" stroke-width="1" rx="5"/>
    <text x="300" y="15" text-anchor="middle" class="label" font-size="14">算术基本定理：每个大于 1 的自然数都能唯一地分解为质数的乘积</text>
  </g>
</svg>
