<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="energyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    算子代数与量子力学：可观测量 = 自伴算子，谱 = 测量值
  </text>
  
  <!-- Quantum system: Hydrogen atom energy levels -->
  <g transform="translate(50, 60)">
    <text x="150" y="0" font-family="Arial, sans-serif" font-size="14" fill="#34495e" text-anchor="middle">氢原子能级（算子的谱）</text>
    
    <!-- Energy axis -->
    <line x1="30" y1="20" x2="30" y2="280" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="15" y="15" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">E</text>
    <text x="15" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">0</text>
    
    <!-- Energy levels (spectral lines) -->
    <line x1="50" y1="260" x2="250" y2="260" stroke="#e74c3c" stroke-width="2.5"/>
    <text x="260" y="264" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">E₁ = -13.6 eV (n=1)</text>
    
    <line x1="50" y1="200" x2="250" y2="200" stroke="#e67e22" stroke-width="2"/>
    <text x="260" y="204" font-family="Arial, sans-serif" font-size="11" fill="#e67e22">E₂ = -3.4 eV (n=2)</text>
    
    <line x1="50" y1="160" x2="250" y2="160" stroke="#f39c12" stroke-width="2"/>
    <text x="260" y="164" font-family="Arial, sans-serif" font-size="11" fill="#f39c12">E₃ = -1.51 eV (n=3)</text>
    
    <line x1="50" y1="135" x2="250" y2="135" stroke="#27ae60" stroke-width="1.5"/>
    <text x="260" y="139" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">E₄ (n=4)</text>
    
    <line x1="50" y1="118" x2="250" y2="118" stroke="#3498db" stroke-width="1.5"/>
    <text x="260" y="122" font-family="Arial, sans-serif" font-size="11" fill="#3498db">E₅ (n=5)</text>
    
    <!-- Continuum -->
    <rect x="50" y="20" width="200" height="70" fill="#9b59b6" opacity="0.15" rx="4"/>
    <text x="150" y="60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9b59b6">连续谱 (E > 0)</text>
    
    <!-- Transition arrow -->
    <path d="M 150,200 L 150,260" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#photon)"/>
    <text x="130" y="235" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">光子发射</text>
    
    <!-- Annotation -->
    <text x="150" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">σ(H) = {E₁, E₂, E₃, ...} ∪ [0,∞)</text>
  </g>
  
  <!-- C*-algebra framework -->
  <g transform="translate(420, 60)">
    <text x="170" y="0" font-family="Arial, sans-serif" font-size="14" fill="#34495e" text-anchor="middle">C*-代数框架</text>
    
    <!-- Box for algebra -->
    <rect x="20" y="20" width="300" height="260" fill="#ecf0f1" rx="8" stroke="#3498db" stroke-width="1.5"/>
    
    <!-- Items -->
    <text x="40" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">量子力学对应</text>
    
    <text x="40" y="80" font-family="Arial, sans-serif" font-size="11" fill="#34495e">可观测量 A</text>
    <text x="180" y="80" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c">⟹</text>
    <text x="210" y="80" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">自伴算子 A = A*</text>
    
    <text x="40" y="110" font-family="Arial, sans-serif" font-size="11" fill="#34495e">可能测量值</text>
    <text x="180" y="110" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c">⟹</text>
    <text x="210" y="110" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">谱 σ(A) ⊂ ℝ</text>
    
    <text x="40" y="140" font-family="Arial, sans-serif" font-size="11" fill="#34495e">量子态</text>
    <text x="180" y="140" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c">⟹</text>
    <text x="210" y="140" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">C*-代数上的态 φ</text>
    
    <text x="40" y="170" font-family="Arial, sans-serif" font-size="11" fill="#34495e">期望值</text>
    <text x="180" y="170" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c">⟹</text>
    <text x="210" y="170" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">φ(A) = ⟨ψ, Aψ⟩</text>
    
    <text x="40" y="200" font-family="Arial, sans-serif" font-size="11" fill="#34495e">同时可测</text>
    <text x="180" y="200" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c">⟹</text>
    <text x="210" y="200" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">AB = BA (交换)</text>
    
    <text x="40" y="230" font-family="Arial, sans-serif" font-size="11" fill="#34495e">测不准原理</text>
    <text x="180" y="230" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c">⟹</text>
    <text x="210" y="230" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">AB ≠ BA (非交换)</text>
    
    <!-- GNS box -->
    <text x="40" y="260" font-family="Arial, sans-serif" font-size="11" fill="#9b59b6" font-weight="bold">GNS 构造：态 → Hilbert 空间表示</text>
  </g>
  
  <!-- Von Neumann algebra types -->
  <g transform="translate(50, 360)">
    <rect x="0" y="0" width="700" height="120" fill="#ecf0f1" rx="8" stroke="#9b59b6" stroke-width="1.5"/>
    
    <text x="350" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">Murray-von Neumann 因子分类 ↔ 物理系统</text>
    
    <!-- Type I -->
    <rect x="20" y="40" width="200" height="65" fill="#3498db" opacity="0.15" rx="6"/>
    <text x="120" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="bold">I 型因子</text>
    <text x="120" y="78" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">M_n(C) ~ B(H)</text>
    <text x="120" y="95" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">有限自由度量子系统</text>
    
    <!-- Type II -->
    <rect x="250" y="40" width="200" height="65" fill="#27ae60" opacity="0.15" rx="6"/>
    <text x="350" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="bold">II₁ 型因子</text>
    <text x="350" y="78" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">超有限因子 R</text>
    <text x="350" y="95" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">无穷粒子统计力学</text>
    
    <!-- Type III -->
    <rect x="480" y="40" width="200" height="65" fill="#e74c3c" opacity="0.15" rx="6"/>
    <text x="580" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50" font-weight="bold">III 型因子</text>
    <text x="580" y="78" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">无有限投影</text>
    <text x="580" y="95" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">量子场论 (局域可观测量)</text>
  </g>
</svg>
