<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="surfGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="surfGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="surfGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Ricci 流：∂ₜg = -2Ric —— 用热方程"熨平"几何
  </text>
  
  <!-- Time sequence: bumpy surface smoothing to sphere -->
  <!-- t=0: Very bumpy -->
  <g transform="translate(30, 70)">
    <text x="80" y="0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e" font-weight="bold">t = 0</text>
    <text x="80" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">初始粗糙度量</text>
    
    <!-- Bumpy surface -->
    <path d="M 10,120 C 20,80 30,60 40,90 C 50,120 55,50 65,70 C 75,90 80,40 90,80 C 100,120 110,55 120,75 C 130,95 140,60 150,100 L 150,150 L 10,150 Z" 
          fill="url(#surfGrad1)" stroke="#c0392b" stroke-width="1.5"/>
    
    <!-- Curvature indicators (red = high) -->
    <circle cx="40" cy="85" r="6" fill="#e74c3c" opacity="0.7"/>
    <circle cx="65" cy="65" r="7" fill="#e74c3c" opacity="0.8"/>
    <circle cx="90" cy="75" r="5" fill="#e74c3c" opacity="0.6"/>
    <circle cx="120" cy="70" r="6" fill="#e74c3c" opacity="0.7"/>
    
    <text x="80" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e74c3c">曲率不均匀</text>
  </g>
  
  <!-- Arrow -->
  <text x="195" y="160" font-family="Arial, sans-serif" font-size="24" fill="#95a5a6">→</text>
  
  <!-- t=1: Less bumpy -->
  <g transform="translate(210, 70)">
    <text x="80" y="0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e" font-weight="bold">t = t₁</text>
    <text x="80" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">曲率开始均匀化</text>
    
    <!-- Smoother surface -->
    <path d="M 10,120 C 25,95 40,85 55,95 C 70,105 85,80 100,90 C 115,100 130,85 150,105 L 150,150 L 10,150 Z" 
          fill="url(#surfGrad2)" stroke="#e67e22" stroke-width="1.5"/>
    
    <!-- Curvature indicators (more uniform) -->
    <circle cx="55" cy="92" r="5" fill="#f39c12" opacity="0.5"/>
    <circle cx="100" cy="87" r="5" fill="#f39c12" opacity="0.5"/>
    
    <text x="80" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#f39c12">曲率趋向均匀</text>
  </g>
  
  <!-- Arrow -->
  <text x="375" y="160" font-family="Arial, sans-serif" font-size="24" fill="#95a5a6">→</text>
  
  <!-- t=final: Perfect sphere -->
  <g transform="translate(400, 70)">
    <text x="80" y="0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e" font-weight="bold">t = T</text>
    <text x="80" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">常曲率度量</text>
    
    <!-- Perfect circle (sphere cross-section) -->
    <circle cx="80" cy="110" r="50" fill="url(#surfGrad3)" stroke="#27ae60" stroke-width="1.5"/>
    
    <!-- Uniform curvature -->
    <circle cx="80" cy="110" r="45" stroke="#2ecc71" stroke-width="1" fill="none" stroke-dasharray="3,3" opacity="0.5"/>
    
    <text x="80" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">Ric = λg (Einstein 度量)</text>
  </g>
  
  <!-- Perelman entropy section -->
  <g transform="translate(570, 70)">
    <text x="100" y="0" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#34495e" font-weight="bold">Perelman 熵</text>
    
    <rect x="0" y="15" width="200" height="160" fill="#ecf0f1" rx="6" stroke="#9b59b6" stroke-width="1.5"/>
    
    <text x="100" y="40" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9b59b6" font-weight="bold">F-熵 (单调递增)</text>
    <text x="100" y="60" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">F = ∫(R+|∇f|²)e⁻ᶠ dV</text>
    
    <!-- Monotone increasing curve -->
    <path d="M 20,130 Q 60,125 100,105 Q 140,85 180,70" stroke="#9b59b6" stroke-width="2" fill="none"/>
    <text x="100" y="148" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">dF/dt ≥ 0</text>
    
    <text x="100" y="168" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#9b59b6">排除"稀释"奇点</text>
  </g>
  
  <!-- Real-world analogy -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="700" height="200" fill="#ecf0f1" rx="8" stroke="#e67e22" stroke-width="1.5"/>
    
    <text x="350" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">现实类比：Ricci 流就像"几何的热传导"</text>
    
    <!-- Heat equation comparison -->
    <text x="30" y="55" font-family="Arial, sans-serif" font-size="12" fill="#34495e">热方程 ∂ₜu = Δu：</text>
    <text x="30" y="75" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">温度不均匀 → 热量从高温流向低温 → 最终温度均匀</text>
    
    <text x="30" y="105" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Ricci 流 ∂ₜg = -2Ric(g)：</text>
    <text x="30" y="125" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">曲率不均匀 → 度量在高曲率处收缩更快 → 最终曲率均匀化</text>
    
    <!-- Application box -->
    <rect x="20" y="145" width="660" height="40" fill="#fff" rx="4" stroke="#3498db" stroke-width="1"/>
    <text x="350" y="163" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50" font-weight="bold">应用：Perelman 用 Ricci 流证明 Poincaré 猜想 (2003)</text>
    <text x="350" y="178" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">任何单连通的封闭 3 维流形 ⟹ 同胚于 S³ —— 几何分析的最高成就之一</text>
  </g>
</svg>
