<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- 两条平行线 -->
  <line x1="50" y1="120" x2="550" y2="120" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="50" y1="280" x2="550" y2="280" stroke="#1565c0" stroke-width="2.5"/>

  <!-- 截线：从左上到右下 -->
  <line x1="150" y1="40" x2="450" y2="360" stroke="#c62828" stroke-width="2"/>

  <!-- 标注平行 -->
  <text x="30" y="115" font-size="14" font-weight="bold" fill="#1565c0">l₁</text>
  <text x="30" y="275" font-size="14" font-weight="bold" fill="#1565c0">l₂</text>
  <text x="490" y="115" font-size="13" fill="#1565c0">l₁ ∥ l₂</text>

  <!-- 交点 P1 (250, 120) 和 P2 (350, 280) -->
  <circle cx="250" cy="120" r="4" fill="#333"/>
  <circle cx="350" cy="280" r="4" fill="#333"/>
  <text x="240" y="115" font-size="11" fill="#333">P₁</text>
  <text x="360" y="295" font-size="11" fill="#333">P₂</text>

  <!-- 截线倾斜角约 39.8°（tan⁻¹(160/300) ≈ 28°，但视觉上类似 45°） -->
  <!-- P1 周围四个方向（半径 r=28）：
       右上点 R₁ = (250+28*cos(-arctan(160/300)), 120+28*sin(-arctan(160/300)))
       截线方向向量 (300, 160)，单位向量 ≈ (0.882, 0.471)
       法线方向向量 (-160, 300)，单位向量 ≈ (-0.471, 0.882)
       P1+截线方向 = (274.7, 133.2)  （右下）
       P1-截线方向 = (225.3, 106.8)  （左上）
       P1+法线方向 = (236.8, 144.7)  （左下）
       P1-法线方向 = (263.2, 95.3)   （右上） -->

  <!-- ∠1 - P1 上方偏右（参考角，同位角位置，≈28°） -->
  <!-- 弧线从 l₁ 右侧方向 (278,120) 到截线右上方向 (263.2,95.3) -->
  <path d="M 278,120 A 28,28 0 0,0 263.2,95.3" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="268" y="92" font-size="14" font-weight="bold" fill="#2e7d32">∠1</text>

  <!-- ∠2 - P2 下方偏右（与∠1 同位角，≈28°） -->
  <!-- P2+截线方向 = (374.7, 293.2)  （右下）
       P2-法线方向 = (363.2, 255.3)  （右上）
       P2+法线方向 = (336.8, 304.7)  （左下）
       同位角位置：l₂ 下方右侧，弧线从 l₂ 右方向 (378,280) 到截线右下方向 (374.7,293.2) -->
  <path d="M 378,280 A 28,28 0 0,1 374.7,293.2" fill="none" stroke="#e65100" stroke-width="2.5"/>
  <text x="382" y="300" font-size="14" font-weight="bold" fill="#e65100">∠2</text>

  <!-- ∠3 - P2 上方偏右（与∠2 内错角，≈28°） -->
  <!-- 内错角位置：截线右侧、两线之间。弧线从截线右上方向 (363.2,255.3) 到 l₂ 右方向 (378,280) -->
  <path d="M 363.2,255.3 A 28,28 0 0,1 378,280" fill="none" stroke="#7b1fa2" stroke-width="2.5"/>
  <text x="370" y="272" font-size="14" font-weight="bold" fill="#7b1fa2">∠3</text>

  <!-- ∠4 - P2 上方偏左（与∠2 同旁内角，≈152°） -->
  <!-- 同旁内角位置：截线左侧、两线之间。弧线从截线左上方向 (336.8,255.3) 到 l₂ 左方向 (322,280) -->
  <path d="M 322,280 A 28,28 0 0,0 336.8,255.3" fill="none" stroke="#1976d2" stroke-width="2.5"/>
  <text x="322" y="272" font-size="14" font-weight="bold" fill="#1976d2">∠4</text>

  <!-- 说明 -->
  <text x="300" y="365" font-size="13" text-anchor="middle">性质：∠1 = ∠2（同位角相等），∠2 = ∠3（内错角相等）</text>
  <text x="300" y="385" font-size="13" text-anchor="middle">∠2 + ∠4 = 180°（同旁内角互补）</text>
</svg>
