 <text x="160" y="313" font-size="11" fill="#333333">2 的倍数</text>

 <rect x="240" y="300" width="16" height="16" rx="3" fill="#ffe0b2" stroke="#e68a00"/>
 <text x="260" y="313" font-size="11" fill="#333333">3 的倍数</text>

 <rect x="350" y="300" width="16" height="16" rx="3" fill="#e8d4f0" stroke="#9933cc"/>
 <text x="370" y="313" font-size="11" fill="#333333">5 的倍数</text>

 <rect x="30" y="325" width="16" height="16" rx="3" fill="#cccccc" stroke="#999999"/>
 <text x="50" y="338" font-size="11" fill="#333333">1（既非素数也非合数）</text>

 <!-- Bottom note -->
 <text x="252" y="355" text-anchor="middle" font-size="10" fill="#888888">筛到 √60 ≈ 7.7 即可：2, 3, 5, 7 的倍数划完后，剩余未划去的即为素数</text>
</svg>
