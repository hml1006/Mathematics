<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heatGradV" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    热传导与位势论：稳态温度场 = 调和函数
  </text>
  
  <!-- 2D plate with temperature distribution -->
  <g transform="translate(50, 60)">
    <text x="150" y="0" font-family="Arial, sans-serif" font-size="14" fill="#34495e" text-anchor="middle">二维金属板稳态温度分布</text>
    
    <!-- Plate (rectangle) with heat gradient -->
    <rect x="0" y="20" width="300" height="200" fill="url(#heatGrad)" opacity="0.7" rx="4" stroke="#2c3e50" stroke-width="1.5"/>
    
    <!-- Boundary temperature labels -->
    <text x="-5" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#3498db">T=0°C</text>
    <text x="305" y="125" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">T=100°C</text>
    <text x="150" y="15" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">T=f(x) (边界条件)</text>
    <text x="150" y="240" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">T=g(x) (边界条件)</text>
    
    <!-- Isotherms (level curves) -->
    <path d="M 60,20 Q 55,120 60,220" stroke="#fff" stroke-width="1" fill="none" stroke-dasharray="4,3" opacity="0.7"/>
    <text x="50" y="130" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="end">25°C</text>
    
    <path d="M 120,20 Q 115,120 120,220" stroke="#fff" stroke-width="1" fill="none" stroke-dasharray="4,3" opacity="0.7"/>
    <text x="110" y="130" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="end">50°C</text>
    
    <path d="M 180,20 Q 175,120 180,220" stroke="#fff" stroke-width="1" fill="none" stroke-dasharray="4,3" opacity="0.7"/>
    <text x="170" y="130" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="end">75°C</text>
    
    <!-- Heat flow arrows -->
    <path d="M 30,120 L 270,120" stroke="#fff" stroke-width="1.5" fill="none" marker-end="url(#heatArrow)" opacity="0.6"/>
    <text x="150" y="115" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff" opacity="0.8">热流方向</text>
  </g>
  
  <!-- 1D temperature profile -->
  <g transform="translate(420, 60)">
    <text x="150" y="0" font-family="Arial, sans-serif" font-size="14" fill="#34495e" text-anchor="middle">温度剖面 u(x)（调和函数）</text>
    
    <!-- Axes -->
    <line x1="0" y1="220" x2="330" y2="220" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="20" x2="0" y2="220" stroke="#95a5a6" stroke-width="1"/>
    
    <!-- Temperature curve (linear for 1D Laplace) -->
    <line x1="20" y1="200" x2="300" y2="40" stroke="#e74c3c" stroke-width="2.5"/>
    
    <!-- Annotations -->
    <text x="20" y="215" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#3498db">x=0</text>
    <text x="300" y="215" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e74c3c">x=L</text>
    <text x="-10" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#3498db">T₁</text>
    <text x="-10" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#e74c3c">T₂</text>
    
    <!-- Mean value property illustration -->
    <circle cx="160" cy="120" r="40" stroke="#9b59b6" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
    <circle cx="160" cy="120" r="3" fill="#9b59b6"/>
    <text x="160" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#9b59b6">球面平均 = 中心值</text>
    
    <!-- Labels -->
    <text x="165" y="240" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Δu = 0（无热源）</text>
  </g>
  
  <!-- Connection to potential theory -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="700" height="170" fill="#ecf0f1" rx="8" stroke="#3498db" stroke-width="1.5"/>
    
    <text x="350" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">位势论 ↔ 热传导的对应</text>
    
    <!-- Left column -->
    <text x="30" y="55" font-family="Arial, sans-serif" font-size="12" fill="#34495e" font-weight="bold">位势论概念</text>
    <text x="30" y="78" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">调和函数 Δu = 0</text>
    <text x="30" y="98" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Dirichlet 问题 (边界值)</text>
    <text x="30" y="118" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Green 函数 G(x,y)</text>
    <text x="30" y="138" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">极值原理</text>
    <text x="30" y="158" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">平均值性质</text>
    
    <!-- Arrow -->
    <text x="320" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#e74c3c">⟹</text>
    <text x="320" y="78" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#e74c3c">⟹</text>
    <text x="320" y="98" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#e74c3c">⟹</text>
    <text x="320" y="118" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#e74c3c">⟹</text>
    <text x="320" y="138" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#e74c3c">⟹</text>
    
    <!-- Right column -->
    <text x="380" y="55" font-family="Arial, sans-serif" font-size="12" fill="#34495e" font-weight="bold">物理现实</text>
    <text x="380" y="78" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">稳态温度分布（无热源）</text>
    <text x="380" y="98" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">边界温度给定后的平衡态</text>
    <text x="380" y="118" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">点热源对温度场的响应</text>
    <text x="380" y="138" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">内部无最热/最冷点</text>
    <text x="380" y="158" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">某点温度 = 周围温度的平均</text>
  </g>
</svg>
