<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">充分统计量：数据的"信息压缩"</text>
  <text x="350" y="52" text-anchor="middle" font-size="13" fill="#7f8c8d">知道 T(X) 后，原始数据不再提供关于 θ 的额外信息</text>

  <!-- Left: Raw data (many points) -->
  <g transform="translate(30, 80)">
    <text x="90" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">原始样本 (n=20)</text>
    <rect x="0" y="10" width="180" height="280" rx="10" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5"/>

    <!-- Data points -->
    <g font-size="11" fill="#333">
      <text x="15" y="35">x₁ = 1</text>
      <text x="15" y="52">x₂ = 0</text>
      <text x="15" y="69">x₃ = 1</text>
      <text x="15" y="86">x₄ = 1</text>
      <text x="15" y="103">x₅ = 0</text>
      <text x="15" y="120">x₆ = 1</text>
      <text x="15" y="137">x₇ = 0</text>
      <text x="15" y="154">x₈ = 1</text>
      <text x="15" y="171">x₉ = 1</text>
      <text x="15" y="188">x₁₀= 1</text>
      <text x="95" y="35">x₁₁= 0</text>
      <text x="95" y="52">x₁₂= 1</text>
      <text x="95" y="69">x₁₃= 1</text>
      <text x="95" y="86">x₁₄= 0</text>
      <text x="95" y="103">x₁₅= 1</text>
      <text x="95" y="120">x₁₆= 1</text>
      <text x="95" y="137">x₁₇= 1</text>
      <text x="95" y="154">x₁₈= 0</text>
      <text x="95" y="171">x₁₉= 1</text>
      <text x="95" y="188">x₂₀= 1</text>
    </g>

    <text x="90" y="215" text-anchor="middle" font-size="12" fill="#7f8c8d">20 个数据点</text>
    <text x="90" y="235" text-anchor="middle" font-size="12" fill="#7f8c8d">大量信息...</text>

    <!-- Bernoulli dots visualization -->
    <g transform="translate(15, 250)">
      <circle cx="5" cy="5" r="4" fill="#e74c3c"/><circle cx="17" cy="5" r="4" fill="#4A90D9"/>
      <circle cx="29" cy="5" r="4" fill="#e74c3c"/><circle cx="41" cy="5" r="4" fill="#e74c3c"/>
      <circle cx="53" cy="5" r="4" fill="#4A90D9"/><circle cx="65" cy="5" r="4" fill="#e74c3c"/>
      <circle cx="77" cy="5" r="4" fill="#4A90D9"/><circle cx="89" cy="5" r="4" fill="#e74c3c"/>
      <circle cx="101" cy="5" r="4" fill="#e74c3c"/><circle cx="113" cy="5" r="4" fill="#e74c3c"/>
      <circle cx="5" cy="18" r="4" fill="#4A90D9"/><circle cx="17" cy="18" r="4" fill="#e74c3c"/>
      <circle cx="29" cy="18" r="4" fill="#e74c3c"/><circle cx="41" cy="18" r="4" fill="#4A90D9"/>
      <circle cx="53" cy="18" r="4" fill="#e74c3c"/><circle cx="65" cy="18" r="4" fill="#e74c3c"/>
      <circle cx="77" cy="18" r="4" fill="#e74c3c"/><circle cx="89" cy="18" r="4" fill="#4A90D9"/>
      <circle cx="101" cy="18" r="4" fill="#e74c3c"/><circle cx="113" cy="18" r="4" fill="#e74c3c"/>
    </g>
  </g>

  <!-- Arrow: compression -->
  <g transform="translate(225, 200)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#4A90D9" stroke-width="3" marker-end="url(#arr)"/>
    <text x="35" y="-12" text-anchor="middle" font-size="12" fill="#4A90D9" font-weight="bold">T = Σxᵢ</text>
    <text x="35" y="20" text-anchor="middle" font-size="11" fill="#7f8c8d">压缩!</text>
  </g>

  <!-- Middle: Sufficient statistic -->
  <g transform="translate(310, 130)">
    <text x="70" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">充分统计量</text>
    <rect x="0" y="10" width="140" height="120" rx="12" fill="#e3f2fd" stroke="#4A90D9" stroke-width="2"/>

    <text x="70" y="50" text-anchor="middle" font-size="28" fill="#1565c0" font-weight="bold">T = 13</text>
    <text x="70" y="78" text-anchor="middle" font-size="12" fill="#555">20次试验中</text>
    <text x="70" y="95" text-anchor="middle" font-size="12" fill="#555">13次成功</text>
    <text x="70" y="118" text-anchor="middle" font-size="11" fill="#4A90D9" font-weight="bold">包含了 p 的全部信息</text>

    <!-- Key insight -->
    <rect x="-5" y="145" width="150" height="55" rx="8" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
    <text x="70" y="165" text-anchor="middle" font-size="11" fill="#2c3e50" font-weight="bold">关键性质：</text>
    <text x="70" y="182" text-anchor="middle" font-size="10" fill="#555">给定 T=13 后，</text>
    <text x="70" y="195" text-anchor="middle" font-size="10" fill="#555">数据的条件分布与 p 无关</text>
  </g>

  <!-- Arrow: inference -->
  <g transform="translate(465, 200)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#27ae60" stroke-width="3" marker-end="url(#arr)"/>
    <text x="35" y="-12" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">推断 p</text>
    <text x="35" y="20" text-anchor="middle" font-size="11" fill="#7f8c8d">估计</text>
  </g>

  <!-- Right: Inference result -->
  <g transform="translate(550, 130)">
    <text x="65" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">关于 p 的推断</text>
    <rect x="0" y="10" width="130" height="120" rx="12" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>

    <text x="65" y="45" text-anchor="middle" font-size="13" fill="#1b5e20" font-weight="bold">p̂ = 13/20</text>
    <text x="65" y="68" text-anchor="middle" font-size="16" fill="#27ae60" font-weight="bold">= 0.65</text>
    <text x="65" y="92" text-anchor="middle" font-size="11" fill="#555">MLE / 矩估计</text>
    <text x="65" y="112" text-anchor="middle" font-size="11" fill="#555">都只依赖 T</text>
  </g>

  <!-- Bottom: Factorization theorem -->
  <g transform="translate(30, 380)">
    <rect x="0" y="0" width="640" height="70" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
    <text x="320" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Neyman-Fisher 因子分解定理</text>
    <text x="320" y="45" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">f(x; θ) = g(T(x); θ) · h(x)</text>
    <text x="320" y="63" text-anchor="middle" font-size="11" fill="#7f8c8d">联合密度能分解为"仅通过T依赖θ" × "不依赖θ" ⟺ T 是充分统计量</text>
  </g>
</svg>
