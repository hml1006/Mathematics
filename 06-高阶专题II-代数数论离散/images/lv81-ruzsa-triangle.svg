<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430">
  <!-- Background -->
  <rect width="620" height="430" fill="#f4ecf7" rx="8"/>
  
  <!-- Title -->
  <text x="310" y="30" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#1a1a2e">Ruzsa 三角不等式与加性结构</text>
  
  <!-- Ruzsa triangle inequality -->
  <rect x="60" y="50" width="500" height="70" rx="8" fill="white" stroke="#8e44ad" stroke-width="2"/>
  <text x="310" y="75" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#8e44ad">Ruzsa 三角不等式</text>
  <text x="310" y="100" text-anchor="middle" font-family="serif" font-size="15" fill="#1a1a2e">|A − C| ≤ |A − B| · |B − C| / |B|</text>
  <text x="310" y="115" text-anchor="middle" font-family="serif" font-size="11" fill="#555">A, B, C 是阿贝尔群中的有限子集</text>
  
  <!-- Visual: sets as circles -->
  <g transform="translate(80, 145)">
    <!-- Set A -->
    <circle cx="50" cy="50" r="40" fill="#d5f5e3" fill-opacity="0.7" stroke="#1e8449" stroke-width="2"/>
    <text x="50" y="55" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#1e8449">A</text>
    <text x="50" y="110" text-anchor="middle" font-family="serif" font-size="11" fill="#555">|A|=5</text>
    
    <!-- Set B -->
    <circle cx="200" cy="50" r="45" fill="#d6eaf8" fill-opacity="0.7" stroke="#2471a3" stroke-width="2"/>
    <text x="200" y="55" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#2471a3">B</text>
    <text x="200" y="110" text-anchor="middle" font-family="serif" font-size="11" fill="#555">|B|=5</text>
    
    <!-- Set C -->
    <circle cx="350" cy="50" r="40" fill="#fadbd8" fill-opacity="0.7" stroke="#c0392b" stroke-width="2"/>
    <text x="350" y="55" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#c0392b">C</text>
    <text x="350" y="110" text-anchor="middle" font-family="serif" font-size="11" fill="#555">|C|=5</text>
    
    <!-- Difference sets -->
    <text x="125" y="30" text-anchor="middle" font-family="serif" font-size="11" fill="#333">A−B</text>
    <text x="275" y="30" text-anchor="middle" font-family="serif" font-size="11" fill="#333">B−C</text>
    <text x="200" y="135" text-anchor="middle" font-family="serif" font-size="11" fill="#333">A−C</text>
    
    <!-- Arrows -->
    <path d="M90,40 L160,40" stroke="#333" stroke-width="1" marker-end="url(#arrR)"/>
    <path d="M240,40 L310,40" stroke="#333" stroke-width="1" marker-end="url(#arrR)"/>
    <path d="M90,70 Q200,140 310,70" stroke="#8e44ad" stroke-width="1.5" fill="none" marker-end="url(#arrR)"/>
  </g>
  
  <defs>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Example -->
  <rect x="60" y="280" width="500" height="70" rx="8" fill="#fef9e7" stroke="#e67e22" stroke-width="2"/>
  <text x="310" y="303" text-anchor="middle" font-family="serif" font-size="12" font-weight="bold" fill="#e67e22">示例验证</text>
  <text x="310" y="323" text-anchor="middle" font-family="serif" font-size="11" fill="#1a1a2e">A={1,3,5,7,9}, B={1,2,3,4,5}: |A−A|=9, |A−B|=17</text>
  <text x="310" y="343" text-anchor="middle" font-family="serif" font-size="11" fill="#555">|A−B|·|A−B|/|A| = 17×17/5 = 57.8 ≥ 17 = |A−B| ✓</text>
  
  <!-- Plunnecke inequality -->
  <rect x="60" y="360" width="240" height="60" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.5"/>
  <text x="180" y="383" text-anchor="middle" font-family="serif" font-size="12" font-weight="bold" fill="#1e8449">Plünnecke 不等式</text>
  <text x="180" y="403" text-anchor="middle" font-family="serif" font-size="11" fill="#1a1a2e">|A+B|≤K|A| → |mB−nB|≤K^{m+n}|A|</text>
  <text x="180" y="418" text-anchor="middle" font-family="serif" font-size="10" fill="#555">控制和集的"膨胀"速度</text>
  
  <!-- Freiman theorem -->
  <rect x="320" y="360" width="240" height="60" rx="8" fill="#d6eaf8" stroke="#2471a3" stroke-width="1.5"/>
  <text x="440" y="383" text-anchor="middle" font-family="serif" font-size="12" font-weight="bold" fill="#2471a3">Freiman 定理</text>
  <text x="440" y="403" text-anchor="middle" font-family="serif" font-size="11" fill="#1a1a2e">|A+A|≤C|A| → A⊂广义等差数列</text>
  <text x="440" y="418" text-anchor="middle" font-family="serif" font-size="10" fill="#555">小和集 → 强结构</text>
</svg>
