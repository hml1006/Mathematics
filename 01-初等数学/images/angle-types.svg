<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- 锐角 -->
  <g transform="translate(80,120)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="40" y2="-50" stroke="#333" stroke-width="2"/>
    <path d="M 20,0 A 20,20 0 0,1 16,-12" fill="none" stroke="#e74c3c" stroke-width="2"/>
    <text x="25" y="-5" font-size="14" fill="#e74c3c">θ</text>
    <text x="0" y="30" font-size="14" text-anchor="middle">锐角</text>
    <text x="0" y="48" font-size="12" fill="#666" text-anchor="middle">0° &lt; θ &lt; 90°</text>
  </g>
  
  <!-- 直角 -->
  <g transform="translate(240,120)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#333" stroke-width="2"/>
    <rect x="0" y="-12" width="12" height="12" fill="none" stroke="#e74c3c" stroke-width="2"/>
    <text x="18" y="-20" font-size="14" fill="#e74c3c">θ</text>
    <text x="0" y="30" font-size="14" text-anchor="middle">直角</text>
    <text x="0" y="48" font-size="12" fill="#666" text-anchor="middle">θ = 90°</text>
  </g>
  
  <!-- 钝角 -->
  <g transform="translate(400,120)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="-30" y2="-50" stroke="#333" stroke-width="2"/>
    <path d="M 25,0 A 25,25 0 0,1 -10,-20" fill="none" stroke="#e74c3c" stroke-width="2"/>
    <text x="15" y="-10" font-size="14" fill="#e74c3c">θ</text>
    <text x="0" y="30" font-size="14" text-anchor="middle">钝角</text>
    <text x="0" y="48" font-size="12" fill="#666" text-anchor="middle">90° &lt; θ &lt; 180°</text>
  </g>
  
  <!-- 平角 -->
  <g transform="translate(560,120)">
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#333" stroke-width="2"/>
    <path d="M 25,0 A 25,25 0 0,1 -25,0" fill="none" stroke="#e74c3c" stroke-width="2"/>
    <text x="0" y="-10" font-size="14" fill="#e74c3c" text-anchor="middle">θ</text>
    <text x="0" y="30" font-size="14" text-anchor="middle">平角</text>
    <text x="0" y="48" font-size="12" fill="#666" text-anchor="middle">θ = 180°</text>
  </g>
  
  <!-- 周角 -->
  <g transform="translate(720,120)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#333" stroke-width="2"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#e74c3c" stroke-width="2"/>
    <text x="30" y="-10" font-size="14" fill="#e74c3c">θ</text>
    <text x="0" y="30" font-size="14" text-anchor="middle">周角</text>
    <text x="0" y="48" font-size="12" fill="#666" text-anchor="middle">θ = 360°</text>
  </g>
</svg>
