<line x1="470.00" y1="316.00" x2="448.00" y2="309.00" style="stroke:#E65100; stroke-width:2.00"/>
<line x1="448.00" y1="309.00" x2="440.00" y2="300.00" style="stroke:#E65100; stroke-width:2.00"/>

<!-- 圆锥体 - 侧面斜线 -->
<line x1="440.00" y1="300.00" x2="500.00" y2="120.00" style="stroke:#E65100; stroke-width:2.00"/>
<line x1="560.00" y1="300.00" x2="500.00" y2="120.00" style="stroke:#E65100; stroke-width:2.00"/>

