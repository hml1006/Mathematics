<?xml version="1.0" encoding="utf-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="360pt" viewBox="0 0 504 360">
 <defs>
  <style type="text/css">
   text { font-family: 'Noto Sans CJK SC', 'SimHei', sans-serif; }
  </style>
 </defs>
 <rect width="504" height="360" fill="#ffffff"/>
 <!-- Title -->
 <text x="252" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">欧拉图 vs 哈密顿图</text>
 <text x="252" y="48" text-anchor="middle" font-size="11" fill="#666666">欧拉回路：经过每条边恰好一次；哈密顿回路：经过每个顶点恰好一次</text>

 <!-- Left side: Euler graph -->
 <text x="126" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c72b0">欧拉图（Euler Graph）</text>
 <text x="126" y="92" text-anchor="middle" font-size="10" fill="#666666">所有顶点度数为偶数</text>

 <!-- Euler graph: K5 (complete graph on 5 vertices) - all vertices have degree 4 -->
 <!-- Vertices arranged in a circle -->
 <circle cx="126" cy="180" r="60" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,3"/>
 <!-- Edges (all connections) -->
 <line x1="126" y1="120" x2="183" y2="150" stroke="#4c72b0" stroke-width="2"/>
 <line x1="126" y1="120" x2="169" y2="210" stroke="#4c72b0" stroke-width="2"/>
 <line x1="126" y1="120" x2="83" y2="210" stroke="#4c72b0" stroke-width="2"/>
 <line x1="126" y1="120" x2="69" y2="150" stroke="#4c72b0" stroke-width="2"/>
 <line x1="183" y1="150" x2="169" y2="210" stroke="#4c72b0" stroke-width="2"/>
 <line x1="183" y1="150" x2="83" y2="210" stroke="#4c72b0" stroke-width="2"/>
 <line x1="183" y1="150" x2="69" y2="150" stroke="#4c72b0" stroke-width="2"/>
 <line x1="169" y1="210" x2="83" y2="210" stroke="#4c72b0" stroke-width="2"/>
 <line x1="169" y1="210" x2="69" y2="150" stroke="#4c72b0" stroke-width="2"/>
 <line x1="83" y1="210" x2="69" y2="150" stroke="#4c72b0" stroke-width="2"/>
 <!-- Vertices -->
 <circle cx="126" cy="120" r="12" fill="#4c72b0" stroke="#333333" stroke-width="2"/>
 <text x="126" y="125" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">1</text>
 <circle cx="183" cy="150" r="12" fill="#4c72b0" stroke="#333333" stroke-width="2"/>
 <text x="183" y="155" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">2</text>
 <circle cx="169" cy="210" r="12" fill="#4c72b0" stroke="#333333" stroke-width="2"/>
 <text x="169" y="215" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">3</text>
 <circle cx="83" cy="210" r="12" fill="#4c72b0" stroke="#333333" stroke-width="2"/>
 <text x="83" y="215" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">4</text>
 <circle cx="69" cy="150" r="12" fill="#4c72b0" stroke="#333333" stroke-width="2"/>
 <text x="69" y="155" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">5</text>

 <text x="126" y="250" text-anchor="middle" font-size="10" fill="#333333">每个顶点度数 = 4（偶数）</text>
 <text x="126" y="265" text-anchor="middle" font-size="10" fill="#70ad47" font-weight="bold">✓ 存在欧拉回路</text>

 <!-- Right side: Hamilton graph -->
 <text x="378" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#ed7d31">哈密顿图（Hamilton Graph）</text>
 <text x="378" y="92" text-anchor="middle" font-size="10" fill="#666666">存在经过所有顶点的回路</text>

 <!-- Hamilton graph: Petersen graph (simplified) - has Hamilton cycle but not Euler -->
 <!-- Outer pentagon -->
 <line x1="378" y1="120" x2="435" y2="150" stroke="#ed7d31" stroke-width="2"/>
 <line x1="435" y1="150" x2="421" y2="210" stroke="#ed7d31" stroke-width="2"/>
 <line x1="421" y1="210" x2="335" y2="210" stroke="#ed7d31" stroke-width="2"/>
 <line x1="335" y1="210" x2="321" y2="150" stroke="#ed7d31" stroke-width="2"/>
 <line x1="321" y1="150" x2="378" y2="120" stroke="#ed7d31" stroke-width="2"/>
 <!-- Inner star -->
 <line x1="378" y1="120" x2="421" y2="210" stroke="#ed7d31" stroke-width="1.5" stroke-dasharray="4,2"/>
 <line x1="378" y1="120" x2="335" y2="210" stroke="#ed7d31" stroke-width="1.5" stroke-dasharray="4,2"/>
 <line x1="435" y1="150" x2="335" y2="210" stroke="#ed7d31" stroke-width="1.5" stroke-dasharray="4,2"/>
 <line x1="435" y1="150" x2="321" y2="150" stroke="#ed7d31" stroke-width="1.5" stroke-dasharray="4,2"/>
 <line x1="421" y1="210" x2="321" y2="150" stroke="#ed7d31" stroke-width="1.5" stroke-dasharray="4,2"/>
 <!-- Vertices -->
 <circle cx="378" cy="120" r="12" fill="#ed7d31" stroke="#333333" stroke-width="2"/>
 <text x="378" y="125" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">1</text>
 <circle cx="435" cy="150" r="12" fill="#ed7d31" stroke="#333333" stroke-width="2"/>
 <text x="435" y="155" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">2</text>
 <circle cx="421" cy="210" r="12" fill="#ed7d31" stroke="#333333" stroke-width="2"/>
 <text x="421" y="215" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">3</text>
 <circle cx="335" cy="210" r="12" fill="#ed7d31" stroke="#333333" stroke-width="2"/>
 <text x="335" y="215" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">4</text>
 <circle cx="321" cy="150" r="12" fill="#ed7d31" stroke="#333333" stroke-width="2"/>
 <text x="321" y="155" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">5</text>

 <text x="378" y="250" text-anchor="middle" font-size="10" fill="#333333">每个顶点度数 = 3（奇数）</text>
 <text x="378" y="265" text-anchor="middle" font-size="10" fill="#cc6666" font-weight="bold">✗ 无欧拉回路</text>
 <text x="378" y="280" text-anchor="middle" font-size="10" fill="#70ad47" font-weight="bold">✓ 有哈密顿回路（实线）</text>

 <!-- Comparison table -->
 <text x="50" y="305" font-size="12" font-weight="bold" fill="#333333">核心区别：</text>
 <text x="50" y="322" font-size="10" fill="#333333">• 欧拉图：关注"边"——每条边恰好走一次（中国邮递员问题）</text>
 <text x="50" y="337" font-size="10" fill="#333333">• 哈密顿图：关注"点"——每个顶点恰好走一次（旅行商问题 TSP）</text>

 <text x="50" y="352" font-size="9" fill="#666666">判定：欧拉图 ⟺ 所有顶点度数为偶数；哈密顿图 ⟺ Dirac/Ore 定理（充分条件）</text>
</svg>
