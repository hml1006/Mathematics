<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
  </defs>
  
  <!-- 标题 -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    平衡点相图：二维线性系统的六种类型
  </text>
  
  <!-- 1. 稳定结点 -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="220" height="180" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2" rx="8"/>
    <text x="110" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#16a085">
      稳定结点
    </text>
    <text x="110" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      两负实根
    </text>
    
    <!-- 坐标轴 -->
    <line x1="30" y1="100" x2="190" y2="100" stroke="#95a5a6" stroke-width="1"/>
    <line x1="110" y1="45" x2="110" y2="155" stroke="#95a5a6" stroke-width="1"/>
    
    <!-- 轨线 (汇聚到中心) -->
    <path d="M 40,50 Q 80,80 110,100" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <path d="M 180,50 Q 140,80 110,100" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <path d="M 40,150 Q 80,120 110,100" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <path d="M 180,150 Q 140,120 110,100" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    
    <!-- 中心点 -->
    <circle cx="110" cy="100" r="5" fill="#16a085"/>
    
    <text x="110" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      所有轨线趋向原点
    </text>
  </g>
  
  <!-- 2. 不稳定结点 -->
  <g transform="translate(290, 70)">
    <rect x="0" y="0" width="220" height="180" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="8"/>
    <text x="110" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">
      不稳定结点
    </text>
    <text x="110" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      两正实根
    </text>
    
    <!-- 坐标轴 -->
    <line x1="30" y1="100" x2="190" y2="100" stroke="#95a5a6" stroke-width="1"/>
    <line x1="110" y1="45" x2="110" y2="155" stroke="#95a5a6" stroke-width="1"/>
    
    <!-- 轨线 (从中心向外) -->
    <path d="M 110,100 Q 80,80 40,50" fill="none" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <path d="M 110,100 Q 140,80 180,50" fill="none" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <path d="M 110,100 Q 80,120 40,150" fill="none" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <path d="M 110,100 Q 140,120 180,150" fill="none" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    
    <!-- 中心点 -->
    <circle cx="110" cy="100" r="5" fill="#c0392b"/>
    
    <text x="110" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      所有轨线远离原点
    </text>
  </g>
  
  <!-- 3. 鞍点 -->
  <g transform="translate(530, 70)">
    <rect x="0" y="0" width="220" height="180" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="8"/>
    <text x="110" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e67e22">
      鞍点
    </text>
    <text x="110" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      一正一负实根
    </text>
    
    <!-- 坐标轴 -->
    <line x1="30" y1="100" x2="190" y2="100" stroke="#95a5a6" stroke-width="1"/>
    <line x1="110" y1="45" x2="110" y2="155" stroke="#95a5a6" stroke-width="1"/>
    
    <!-- 稳定流形 (汇聚) -->
    <path d="M 40,50 Q 80,80 110,100" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <path d="M 180,150 Q 140,120 110,100" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    
    <!-- 不稳定流形 (发散) -->
    <path d="M 110,100 Q 140,80 180,50" fill="none" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <path d="M 110,100 Q 80,120 40,150" fill="none" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    
    <!-- 中心点 -->
    <circle cx="110" cy="100" r="5" fill="#e67e22"/>
    
    <text x="110" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      一个方向汇聚，另一个发散
    </text>
  </g>
  
  <!-- 4. 稳定焦点 -->
  <g transform="translate(50, 270)">
    <rect x="0" y="0" width="220" height="180" fill="#e8daef" stroke="#9b59b6" stroke-width="2" rx="8"/>
    <text x="110" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#8e44ad">
      稳定焦点
    </text>
    <text x="110" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      共轭复根(实部为负)
    </text>
    
    <!-- 坐标轴 -->
    <line x1="30" y1="100" x2="190" y2="100" stroke="#95a5a6" stroke-width="1"/>
    <line x1="110" y1="45" x2="110" y2="155" stroke="#95a5a6" stroke-width="1"/>
    
    <!-- 螺旋轨线 (向内) -->
    <path d="M 180,100 Q 180,60 140,50 Q 100,40 80,70 Q 60,100 90,120 Q 120,140 140,110 Q 160,80 130,70 Q 100,60 95,90 Q 90,120 115,115" fill="none" stroke="#9b59b6" stroke-width="1.5" marker-end="url(#arrow)"/>
    
    <!-- 中心点 -->
    <circle cx="110" cy="100" r="5" fill="#8e44ad"/>
    
    <text x="110" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      螺旋趋近原点
    </text>
  </g>
  
  <!-- 5. 不稳定焦点 -->
  <g transform="translate(290, 270)">
    <rect x="0" y="0" width="220" height="180" fill="#d6eaf8" stroke="#3498db" stroke-width="2" rx="8"/>
    <text x="110" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2980b9">
      不稳定焦点
    </text>
    <text x="110" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      共轭复根(实部为正)
    </text>
    
    <!-- 坐标轴 -->
    <line x1="30" y1="100" x2="190" y2="100" stroke="#95a5a6" stroke-width="1"/>
    <line x1="110" y1="45" x2="110" y2="155" stroke="#95a5a6" stroke-width="1"/>
    
    <!-- 螺旋轨线 (向外) -->
    <path d="M 115,115 Q 90,120 95,90 Q 100,60 130,70 Q 160,80 140,110 Q 120,140 90,120 Q 60,100 80,70 Q 100,40 140,50 Q 180,60 180,100" fill="none" stroke="#3498db" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    
    <!-- 中心点 -->
    <circle cx="110" cy="100" r="5" fill="#2980b9"/>
    
    <text x="110" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      螺旋远离原点
    </text>
  </g>
  
  <!-- 6. 中心 -->
  <g transform="translate(530, 270)">
    <rect x="0" y="0" width="220" height="180" fill="#fff5e6" stroke="#f39c12" stroke-width="2" rx="8"/>
    <text x="110" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e67e22">
      中心
    </text>
    <text x="110" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      纯虚根
    </text>
    
    <!-- 坐标轴 -->
    <line x1="30" y1="100" x2="190" y2="100" stroke="#95a5a6" stroke-width="1"/>
    <line x1="110" y1="45" x2="110" y2="155" stroke="#95a5a6" stroke-width="1"/>
    
    <!-- 周期轨道 (同心椭圆) -->
    <ellipse cx="110" cy="100" rx="20" ry="15" fill="none" stroke="#f39c12" stroke-width="1.5"/>
    <ellipse cx="110" cy="100" rx="35" ry="25" fill="none" stroke="#f39c12" stroke-width="1.5"/>
    <ellipse cx="110" cy="100" rx="50" ry="35" fill="none" stroke="#f39c12" stroke-width="1.5"/>
    <ellipse cx="110" cy="100" rx="65" ry="45" fill="none" stroke="#f39c12" stroke-width="1.5"/>
    
    <!-- 箭头表示方向 -->
    <path d="M 130,100 L 130,95" fill="none" stroke="#f39c12" stroke-width="1.5" marker-end="url(#arrow)"/>
    
    <!-- 中心点 -->
    <circle cx="110" cy="100" r="5" fill="#e67e22"/>
    
    <text x="110" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      周期轨道(封闭曲线)
    </text>
  </g>
  
  <!-- 底部判断方法 -->
  <g transform="translate(100, 470)">
    <rect x="0" y="0" width="600" height="110" fill="#f8f9fa" stroke="#95a5a6" stroke-width="2" rx="8"/>
    
    <text x="300" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      判断方法：看 Jacobian 矩阵的特征值
    </text>
    
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      • 实部均为负 → <tspan fill="#16a085" font-weight="bold">稳定</tspan> (结点或焦点)
    </text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      • 实部均为正 → <tspan fill="#c0392b" font-weight="bold">不稳定</tspan> (结点或焦点)
    </text>
    <text x="20" y="90" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      • 一正一负 → <tspan fill="#e67e22" font-weight="bold">鞍点</tspan> (不稳定)    • 纯虚根 → <tspan fill="#e67e22" font-weight="bold">中心</tspan> (周期运动)
    </text>
  </g>
</svg>
