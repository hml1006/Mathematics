<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- 圆 -->
  <circle cx="300" cy="200" r="160" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  
  <!-- 圆心 O -->
  <circle cx="300" cy="200" r="4" fill="#c62828"/>
  <text x="310" y="195" font-size="14" font-weight="bold" fill="#c62828">O</text>
  
  <!-- 直径 AB -->
  <line x1="140" y1="200" x2="460" y2="200" stroke="#c62828" stroke-width="2.5"/>
  <circle cx="140" cy="200" r="4" fill="#333"/>
  <circle cx="460" cy="200" r="4" fill="#333"/>
  <text x="130" y="195" font-size="14" font-weight="bold">A</text>
  <text x="465" y="195" font-size="14" font-weight="bold">B</text>
  
  <!-- 点 C 在圆上 -->
  <circle cx="300" cy="40" r="4" fill="#333"/>
  <text x="310" y="35" font-size="14" font-weight="bold">C</text>
  
  <!-- 三角形 ABC -->
  <line x1="140" y1="200" x2="300" y2="40" stroke="#2e7d32" stroke-width="2"/>
  <line x1="300" y1="40" x2="460" y2="200" stroke="#2e7d32" stroke-width="2"/>
  
  <!-- 直角标记 -->
  <path d="M 285,55 L 300,50 L 305,65" fill="none" stroke="#e65100" stroke-width="2"/>
  <text x="270" y="70" font-size="14" font-weight="bold" fill="#e65100">90°</text>
  
  <!-- 标注直径 -->
  <text x="300" y="230" font-size="14" text-anchor="middle" fill="#c62828">直径 AB</text>
  
  <!-- 说明 -->
  <text x="300" y="350" font-size="14" text-anchor="middle" font-weight="bold">直径所对的圆周角是直角</text>
  <text x="300" y="370" font-size="13" text-anchor="middle">∠ACB = 90°</text>
</svg>
