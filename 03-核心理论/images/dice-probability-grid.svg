  <!-- Highlight: sum=7 diagonal -->
  <g transform="translate(60, 80)" opacity="0.3">
    <rect x="310" y="40" width="50" height="50" rx="6" fill="#FFD700" stroke="#FFD700" stroke-width="3"/>
    <rect x="250" y="100" width="50" height="50" rx="6" fill="#FFD700" stroke="#FFD700" stroke-width="3"/>
    <rect x="190" y="160" width="50" height="50" rx="6" fill="#FFD700" stroke="#FFD700" stroke-width="3"/>
    <rect x="130" y="220" width="50" height="50" rx="6" fill="#FFD700" stroke="#FFD700" stroke-width="3"/>
    <rect x="70" y="280" width="50" height="50" rx="6" fill="#FFD700" stroke="#FFD700" stroke-width="3"/>
    <rect x="10" y="340" width="50" height="50" rx="6" fill="#FFD700" stroke="#FFD700" stroke-width="3"/>
  </g>

  <!-- Annotation for sum=7 -->
  <line x1="430" y1="230" x2="460" y2="200" stroke="#FFD700" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="465" y="195" font-size="13" fill="#b8860b" font-weight="bold">和=7 的6种组合</text>
  <text x="465" y="213" font-size="12" fill="#7f8c8d">P(和=7) = 6/36 = 1/6</text>

  <!-- Legend -->
  <g transform="translate(420, 250)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#2c3e50">各和值概率：</text>
    <g font-size="11" fill="#555">
      <text x="0" y="22">和=2: 1/36 (2.8%)</text>
      <text x="0" y="40">和=3: 2/36 (5.6%)</text>
      <text x="0" y="58">和=4: 3/36 (8.3%)</text>
      <text x="0" y="76">和=5: 4/36 (11.1%)</text>
      <text x="0" y="94">和=6: 5/36 (13.9%)</text>
      <text x="0" y="112" font-weight="bold" fill="#f57f17">和=7: 6/36 (16.7%) ★</text>
      <text x="0" y="130">和=8: 5/36 (13.9%)</text>
      <text x="0" y="148">和=9: 4/36 (11.1%)</text>
      <text x="0" y="166">和=10: 3/36 (8.3%)</text>
      <text x="0" y="184">和=11: 2/36 (5.6%)</text>
      <text x="0" y="202">和=12: 1/36 (2.8%)</text>
    </g>
  </g>

  <!-- Bottom note -->
  <rect x="30" y="475" width="620" height="35" rx="8" fill="#f0f4ff" stroke="#4A90D9" stroke-width="1"/>
  <text x="340" y="498" text-anchor="middle" font-size="13" fill="#2c3e50">🎲 现实类比：赌场里"押7"总是最热门——因为两颗骰子之和为7的概率最高！这就是离散概率的对称之美。</text>
</svg>
