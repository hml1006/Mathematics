      <rect x="190" y="280" width="50" height="50" rx="6" fill="#fbe9e7" stroke="#ffab91" stroke-width="1.5"/>
      <text x="215" y="312" fill="#bf360c">9</text>
      <rect x="250" y="280" width="50" height="50" rx="6" fill="#efebe9" stroke="#bcaaa4" stroke-width="1.5"/>
      <text x="275" y="312" fill="#4e342e">10</text>
      <rect x="310" y="280" width="50" height="50" rx="6" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1.5"/>
      <text x="335" y="312" fill="#283593">11</text>
      <!-- Row 6 -->
      <rect x="10" y="340" width="50" height="50" rx="6" fill="#fff9c4" stroke="#fff176" stroke-width="1.5"/>
      <text x="35" y="372" fill="#f57f17">7</text>
      <rect x="70" y="340" width="50" height="50" rx="6" fill="#e0f7fa" stroke="#80deea" stroke-width="1.5"/>
      <text x="95" y="372" fill="#00838f">8</text>
      <rect x="130" y="340" width="50" height="50" rx="6" fill="#fbe9e7" stroke="#ffab91" stroke-width="1.5"/>
      <text x="155" y="372" fill="#bf360c">9</text>
      <rect x="190" y="340" width="50" height="50" rx="6" fill="#efebe9" stroke="#bcaaa4" stroke-width="1.5"/>
      <text x="215" y="372" fill="#4e342e">10</text>
      <rect x="250" y="340" width="50" height="50" rx="6" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1.5"/>
      <text x="275" y="372" fill="#283593">11</text>
      <rect x="310" y="340" width="50" height="50" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
