[book]
title = "数学天梯攀爬教程"
authors = ["Mathematics Project"]
language = "zh"
description = "从初等到高等，循序渐进构建完整数学知识体系。共 9 大学习阶段、151 个层级。"

[build]
build-dir = "book"
create-missing = false

[preprocessor.katex]
after = ["links"]
# 使用项目自托管的 KaTeX 样式与字体，避免依赖 CDN
no-css = true
# 与原有浏览器端渲染一致，错误时不抛异常
throw-on-error = false

[output.html]
site-url = "/"
smart-punctuation = false
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["src/katex/katex.min.css"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = false