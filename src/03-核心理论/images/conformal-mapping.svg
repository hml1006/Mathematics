<?xml version="1.0" encoding="utf-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="350" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">
    共形映射：保角性
  </text>
  
  <!-- Left panel: z-plane -->
  <g id="z-plane">
    <!-- Axes -->
    <line x1="50" y1="200" x2="230" y2="200" stroke="#666" stroke-width="1.5"/>
    <line x1="140" y1="110" x2="140" y2="290" stroke="#666" stroke-width="1.5"/>
    <text x="235" y="205" font-family="serif" font-size="14" font-style="italic" fill="#666">Re</text>
    <text x="145" y="105" font-family="serif" font-size="14" font-style="italic" fill="#666">Im</text>
    
    <!-- Grid lines (subtle) -->
    <line x1="80" y1="110" x2="80" y2="290" stroke="#ddd" stroke-width="0.5"/>
    <line x1="110" y1="110" x2="110" y2="290" stroke="#ddd" stroke-width="0.5"/>
    <line x1="170" y1="110" x2="170" y2="290" stroke="#ddd" stroke-width="0.5"/>
    <line x1="200" y1="110" x2="200" y2="290" stroke="#ddd" stroke-width="0.5"/>
    <line x1="50" y1="140" x2="230" y2="140" stroke="#ddd" stroke-width="0.5"/>
    <line x1="50" y1="170" x2="230" y2="170" stroke="#ddd" stroke-width="0.5"/>
    <line x1="50" y1="230" x2="230" y2="230" stroke="#ddd" stroke-width="0.5"/>
    <line x1="50" y1="260" x2="230" y2="260" stroke="#ddd" stroke-width="0.5"/>
    
    <!-- Two intersecting curves -->
    <path d="M 70 250 Q 120 180, 180 150" fill="none" stroke="#1976d2" stroke-width="2.5"/>
    <path d="M 80 140 Q 130 190, 190 240" fill="none" stroke="#c44e52" stroke-width="2.5"/>
    
    <!-- Intersection point z₀ -->
    <circle cx="140" cy="200" r="5" fill="#333"/>
    <text x="150" y="195" font-family="serif" font-size="14" font-style="italic" fill="#333">z₀</text>
    
    <!-- Angle arc -->
    <path d="M 155 195 Q 150 185, 145 180" fill="none" stroke="#ff9800" stroke-width="2"/>
    <text x="160" y="175" font-family="serif" font-size="13" fill="#ff9800">α</text>
    
    <!-- Label -->
    <text x="140" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">
      z 平面
    </text>
  </g>
  
  <!-- Arrow indicating mapping -->
  <g id="mapping-arrow">
    <line x1="250" y1="200" x2="330" y2="200" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrowhead)"/>
    <text x="290" y="185" text-anchor="middle" font-family="serif" font-size="15" font-style="italic" fill="#2e7d32">
      w = f(z)
    </text>
    <text x="290" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">
      全纯函数
    </text>
  </g>
  
  <!-- Right panel: w-plane -->
  <g id="w-plane">
    <!-- Axes -->
    <line x1="350" y1="200" x2="530" y2="200" stroke="#666" stroke-width="1.5"/>
    <line x1="440" y1="110" x2="440" y2="290" stroke="#666" stroke-width="1.5"/>
    <text x="535" y="205" font-family="serif" font-size="14" font-style="italic" fill="#666">Re</text>
    <text x="445" y="105" font-family="serif" font-size="14" font-style="italic" fill="#666">Im</text>
    
    <!-- Grid lines (subtle) -->
    <line x1="380" y1="110" x2="380" y2="290" stroke="#ddd" stroke-width="0.5"/>
    <line x1="410" y1="110" x2="410" y2="290" stroke="#ddd" stroke-width="0.5"/>
    <line x1="470" y1="110" x2="470" y2="290" stroke="#ddd" stroke-width="0.5"/>
    <line x1="500" y1="110" x2="500" y2="290" stroke="#ddd" stroke-width="0.5"/>
    <line x1="350" y1="140" x2="530" y2="140" stroke="#ddd" stroke-width="0.5"/>
    <line x1="350" y1="170" x2="530" y2="170" stroke="#ddd" stroke-width="0.5"/>
    <line x1="350" y1="230" x2="530" y2="230" stroke="#ddd" stroke-width="0.5"/>
    <line x1="350" y1="260" x2="530" y2="260" stroke="#ddd" stroke-width="0.5"/>
    
    <!-- Mapped curves (angle preserved but curves may bend) -->
    <path d="M 380 260 Q 420 210, 470 160" fill="none" stroke="#1976d2" stroke-width="2.5"/>
    <path d="M 390 150 Q 430 190, 480 230" fill="none" stroke="#c44e52" stroke-width="2.5"/>
    
    <!-- Mapped intersection point w₀ -->
    <circle cx="440" cy="200" r="5" fill="#333"/>
    <text x="450" y="195" font-family="serif" font-size="14" font-style="italic" fill="#333">w₀</text>
    
    <!-- Angle arc (same angle α) -->
    <path d="M 455 195 Q 450 185, 445 180" fill="none" stroke="#ff9800" stroke-width="2"/>
    <text x="460" y="175" font-family="serif" font-size="13" fill="#ff9800">α</text>
    
    <!-- Label -->
    <text x="440" y="320" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">
      w 平面
    </text>
  </g>
  
  <!-- Bottom annotation -->
  <rect x="100" y="335" width="400" height="10" rx="5" fill="#e8f5e9"/>
  <text x="300" y="343" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2e7d32">
    共形映射保持曲线夹角不变（保角性）
  </text>
</svg>
