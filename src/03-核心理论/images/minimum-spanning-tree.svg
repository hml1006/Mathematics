<?xml version="1.0" encoding="utf-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="360pt" viewBox="0 0 504 360">
 <defs>
  <style type="text/css">
   text { font-family: 'Noto Sans CJK SC', 'SimHei', sans-serif; }
  </style>
 </defs>
 <rect width="504" height="360" fill="#ffffff"/>
 <!-- Title -->
 <text x="252" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">最小生成树（MST）：Kruskal 算法</text>
 <text x="252" y="48" text-anchor="middle" font-size="11" fill="#666666">贪心选择最小权边，不形成环则加入</text>

 <!-- Left: Original graph -->
 <text x="126" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">原图（带权）</text>

 <!-- Vertices -->
 <circle cx="80" cy="130" r="14" fill="#4c72b0" stroke="#333333" stroke-width="2"/>
 <text x="80" y="135" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">A</text>

 <circle cx="170" cy="130" r="14" fill="#4c72b0" stroke="#333333" stroke-width="2"/>
 <text x="170" y="135" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">B</text>

 <circle cx="80" cy="210" r="14" fill="#4c72b0" stroke="#333333" stroke-width="2"/>
 <text x="80" y="215" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">C</text>

 <circle cx="170" cy="210" r="14" fill="#4c72b0" stroke="#333333" stroke-width="2"/>
 <text x="170" y="215" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">D</text>

 <!-- Edges with weights -->
 <!-- A-B: 4 -->
 <line x1="94" y1="130" x2="156" y2="130" stroke="#999999" stroke-width="2"/>
 <text x="125" y="125" text-anchor="middle" font-size="11" fill="#666666">4</text>

 <!-- A-C: 2 -->
 <line x1="80" y1="144" x2="80" y2="196" stroke="#999999" stroke-width="2"/>
 <text x="70" y="172" text-anchor="middle" font-size="11" fill="#666666">2</text>

 <!-- A-D: 6 -->
 <line x1="90" y1="140" x2="160" y2="200" stroke="#999999" stroke-width="2"/>
 <text x="135" y="165" text-anchor="middle" font-size="11" fill="#666666">6</text>

 <!-- B-C: 1 -->
 <line x1="160" y1="140" x2="90" y2="200" stroke="#999999" stroke-width="2"/>
 <text x="115" y="180" text-anchor="middle" font-size="11" fill="#666666">1</text>

 <!-- B-D: 3 -->
 <line x1="170" y1="144" x2="170" y2="196" stroke="#999999" stroke-width="2"/>
 <text x="180" y="172" text-anchor="middle" font-size="11" fill="#666666">3</text>

 <!-- C-D: 5 -->
 <line x1="94" y1="210" x2="156" y2="210" stroke="#999999" stroke-width="2"/>
 <text x="125" y="225" text-anchor="middle" font-size="11" fill="#666666">5</text>

 <!-- Right: MST result -->
 <text x="378" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">最小生成树（MST）</text>

 <!-- Vertices -->
 <circle cx="332" cy="130" r="14" fill="#70ad47" stroke="#333333" stroke-width="2"/>
 <text x="332" y="135" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">A</text>

 <circle cx="422" cy="130" r="14" fill="#70ad47" stroke="#333333" stroke-width="2"/>
 <text x="422" y="135" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">B</text>

 <circle cx="332" cy="210" r="14" fill="#70ad47" stroke="#333333" stroke-width="2"/>
 <text x="332" y="215" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">C</text>

 <circle cx="422" cy="210" r="14" fill="#70ad47" stroke="#333333" stroke-width="2"/>
 <text x="422" y="215" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">D</text>

 <!-- MST edges (highlighted) -->
 <!-- B-C: 1 (first) -->
 <line x1="412" y1="140" x2="342" y2="200" stroke="#ed7d31" stroke-width="3"/>
 <text x="367" y="180" text-anchor="middle" font-size="12" fill="#ed7d31" font-weight="bold">1</text>

 <!-- A-C: 2 (second) -->
 <line x1="332" y1="144" x2="332" y2="196" stroke="#ed7d31" stroke-width="3"/>
 <text x="322" y="172" text-anchor="middle" font-size="12" fill="#ed7d31" font-weight="bold">2</text>

 <!-- B-D: 3 (third) -->
 <line x1="422" y1="144" x2="422" y2="196" stroke="#ed7d31" stroke-width="3"/>
 <text x="432" y="172" text-anchor="middle" font-size="12" fill="#ed7d31" font-weight="bold">3</text>

 <!-- Algorithm steps -->
 <text x="50" y="255" font-size="12" font-weight="bold" fill="#333333">Kruskal 算法步骤：</text>

 <text x="50" y="275" font-size="10" fill="#333333">1. 将所有边按权重排序：1, 2, 3, 4, 5, 6</text>
 <text x="50" y="292" font-size="10" fill="#ed7d31" font-weight="bold">2. 选 B-C (1)：加入 ✓</text>
 <text x="50" y="309" font-size="10" fill="#ed7d31" font-weight="bold">3. 选 A-C (2)：加入 ✓</text>
 <text x="50" y="326" font-size="10" fill="#ed7d31" font-weight="bold">4. 选 B-D (3)：加入 ✓</text>
 <text x="50" y="343" font-size="10" fill="#666666">5. 选 A-B (4)：形成环 A-B-D-C-A，跳过 ✗</text>

 <text x="350" y="275" font-size="11" font-weight="bold" fill="#333333">MST 总权重：</text>
 <text x="350" y="295" font-size="14" fill="#70ad47" font-weight="bold">1 + 2 + 3 = 6</text>

 <text x="350" y="320" font-size="10" fill="#666666">边数 = 顶点数 - 1 = 3</text>
 <text x="350" y="337" font-size="10" fill="#666666">连通所有顶点</text>
 <text x="350" y="354" font-size="10" fill="#666666">无环（树结构）</text>
</svg>
