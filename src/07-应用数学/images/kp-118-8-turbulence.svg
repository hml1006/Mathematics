   <g id="text_1">
    <text style="font-size: 12.5px; font-family: 'Noto Sans CJK SC', 'WenQuanYi Zen Hei', sans-serif; text-anchor: middle; fill: #222222" x="302.04" y="87.045105" transform="rotate(-0 302.04 87.045105)">湍流：大小涡旋套叠，流动随机而多尺度</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC', 'WenQuanYi Zen Hei', sans-serif; text-anchor: middle; fill: #4c72b0" x="107.4456" y="105.060785" transform="rotate(-0 107.4456 105.060785)">大涡</text>
