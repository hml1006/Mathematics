<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">拓扑量子场论：从流形到不变量</text>
  
  <!-- 左侧：Cobordism范畴 -->
  <g transform="translate(200, 250)">
    <text x="0" y="-130" font-size="18" font-weight="bold" text-anchor="middle" fill="#e74c3c">Cobordism范畴</text>
    
    <!-- 流形 -->
    <ellipse cx="-60" cy="-50" rx="30" ry="20" fill="#e74c3c" fill-opacity="0.2" stroke="#e74c3c" stroke-width="2"/>
    <text x="-60" y="-45" font-size="12" text-anchor="middle" fill="#c0392b">M</text>
    
    <ellipse cx="60" cy="-50" rx="30" ry="20" fill="#e74c3c" fill-opacity="0.2" stroke="#e74c3c" stroke-width="2"/>
    <text x="60" y="-45" font-size="12" text-anchor="middle" fill="#c0392b">N</text>
    
    <!-- Cobordism -->
    <path d="M -60 -30 Q 0 0 60 -30" fill="#e74c3c" fill-opacity="0.1" stroke="#e74c3c" stroke-width="2"/>
    <text x="0" y="-10" font-size="12" text-anchor="middle" fill="#c0392b">W</text>
    
    <!-- 箭头 -->
    <path d="M -30 -50 L 30 -50" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
    
    <text x="0" y="30" font-size="12" text-anchor="middle" fill="#7f8c8d">对象：闭流形</text>
    <text x="0" y="50" font-size="12" text-anchor="middle" fill="#7f8c8d">态射：带边流形</text>
  </g>
  
  <!-- 中间：TQFT函子 -->
  <g transform="translate(400, 250)">
    <text x="0" y="-130" font-size="18" font-weight="bold" text-anchor="middle" fill="#3498db">TQFT函子 Z</text>
    
    <!-- 函子映射 -->
    <rect x="-80" y="-80" width="160" height="120" rx="10" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="2"/>
    
    <text x="0" y="-55" font-size="13" text-anchor="middle" fill="#2980b9" font-weight="bold">Z: Cob_d → Vect</text>
    
    <text x="0" y="-30" font-size="12" text-anchor="middle" fill="#2980b9">Z(M) = 向量空间</text>
    <text x="0" y="-10" font-size="12" text-anchor="middle" fill="#2980b9">Z(W) = 线性映射</text>
    <text x="0" y="10" font-size="12" text-anchor="middle" fill="#2980b9">Z(M₁⊔M₂) = Z(M₁)⊗Z(M₂)</text>
    
    <text x="0" y="30" font-size="12" text-anchor="middle" fill="#2980b9">Z(∂W) = 配对</text>
  </g>
  
  <!-- 右侧：不变量 -->
  <g transform="translate(600, 250)">
    <text x="0" y="-130" font-size="18" font-weight="bold" text-anchor="middle" fill="#9b59b6">拓扑不变量</text>
    
    <!-- 各种不变量 -->
    <rect x="-80" y="-80" width="160" height="40" rx="5" fill="#9b59b6" fill-opacity="0.2" stroke="#9b59b6" stroke-width="2"/>
    <text x="0" y="-55" font-size="12" text-anchor="middle" fill="#8e44ad" font-weight="bold">Jones多项式</text>
    
    <rect x="-80" y="-30" width="160" height="40" rx="5" fill="#9b59b6" fill-opacity="0.2" stroke="#9b59b6" stroke-width="2"/>
    <text x="0" y="-5" font-size="12" text-anchor="middle" fill="#8e44ad" font-weight="bold">Donaldson不变量</text>
    
    <rect x="-80" y="20" width="160" height="40" rx="5" fill="#9b59b6" fill-opacity="0.2" stroke="#9b59b6" stroke-width="2"/>
    <text x="0" y="45" font-size="12" text-anchor="middle" fill="#8e44ad" font-weight="bold">Gromov-Witten不变量</text>
  </g>
  
  <!-- 底部：核心例子 -->
  <g transform="translate(400, 450)">
    <rect x="-350" y="-40" width="700" height="100" rx="10" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    
    <text x="0" y="-15" font-size="16" font-weight="bold" text-anchor="middle" fill="#856404">核心构造</text>
    
    <text x="-250" y="10" font-size="13" text-anchor="middle" fill="#856404">• Chern-Simons理论</text>
    <text x="-50" y="10" font-size="13" text-anchor="middle" fill="#856404">• 量子群</text>
    <text x="100" y="10" font-size="13" text-anchor="middle" fill="#856404">• 模张量范畴</text>
    <text x="280" y="10" font-size="13" text-anchor="middle" fill="#856404">• Frobenius代数</text>
    
    <text x="0" y="35" font-size="13" text-anchor="middle" fill="#856404">2维TQFT ≅ 交换Frobenius代数</text>
  </g>
  
  <!-- 顶部：Atiyah公理 -->
  <g transform="translate(400, 100)">
    <rect x="-300" y="-25" width="600" height="50" rx="8" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
    <text x="0" y="0" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">Atiyah公理</text>
    <text x="0" y="20" font-size="12" text-anchor="middle" fill="#34495e">对称幺半函子 • 拓扑不变性 • 拼接公理</text>
  </g>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>
