<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">娱乐数学：游戏与美感</text>
  
  <!-- 左侧：组合游戏 -->
  <g transform="translate(200, 200)">
    <text x="0" y="-100" font-size="18" font-weight="bold" text-anchor="middle" fill="#e74c3c">组合游戏</text>
    
    <!-- Nim游戏 -->
    <rect x="-70" y="-70" width="140" height="80" rx="10" fill="#e74c3c" fill-opacity="0.15" stroke="#e74c3c" stroke-width="2"/>
    
    <!-- 石子堆 -->
    <circle cx="-40" cy="-40" r="8" fill="#e74c3c"/>
    <circle cx="-40" cy="-20" r="8" fill="#e74c3c"/>
    <circle cx="-40" cy="0" r="8" fill="#e74c3c"/>
    
    <circle cx="-10" cy="-40" r="8" fill="#e74c3c"/>
    <circle cx="-10" cy="-20" r="8" fill="#e74c3c"/>
    
    <circle cx="20" cy="-40" r="8" fill="#e74c3c"/>
    <circle cx="20" cy="-20" r="8" fill="#e74c3c"/>
    <circle cx="20" cy="0" r="8" fill="#e74c3c"/>
    <circle cx="20" cy="20" r="8" fill="#e74c3c"/>
    
    <text x="0" y="40" font-size="12" text-anchor="middle" fill="#c0392b">Nim游戏</text>
    <text x="0" y="60" font-size="11" text-anchor="middle" fill="#7f8c8d">Grundy数 • XOR策略</text>
  </g>
  
  <!-- 中间：幻方 -->
  <g transform="translate(400, 200)">
    <text x="0" y="-100" font-size="18" font-weight="bold" text-anchor="middle" fill="#3498db">幻方</text>
    
    <!-- 3x3幻方 -->
    <g transform="translate(-60, -60)">
      <rect x="0" y="0" width="40" height="40" fill="#ecf0f1" stroke="#3498db" stroke-width="2"/>
      <text x="20" y="25" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">8</text>
      
      <rect x="40" y="0" width="40" height="40" fill="#ecf0f1" stroke="#3498db" stroke-width="2"/>
      <text x="60" y="25" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">1</text>
      
      <rect x="80" y="0" width="40" height="40" fill="#ecf0f1" stroke="#3498db" stroke-width="2"/>
      <text x="100" y="25" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">6</text>
      
      <rect x="0" y="40" width="40" height="40" fill="#ecf0f1" stroke="#3498db" stroke-width="2"/>
      <text x="20" y="65" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">3</text>
      
      <rect x="40" y="40" width="40" height="40" fill="#ecf0f1" stroke="#3498db" stroke-width="2"/>
      <text x="60" y="65" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">5</text>
      
      <rect x="80" y="40" width="40" height="40" fill="#ecf0f1" stroke="#3498db" stroke-width="2"/>
      <text x="100" y="65" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">7</text>
      
      <rect x="0" y="80" width="40" height="40" fill="#ecf0f1" stroke="#3498db" stroke-width="2"/>
      <text x="20" y="105" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">4</text>
      
      <rect x="40" y="80" width="40" height="40" fill="#ecf0f1" stroke="#3498db" stroke-width="2"/>
      <text x="60" y="105" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">9</text>
      
      <rect x="80" y="80" width="40" height="40" fill="#ecf0f1" stroke="#3498db" stroke-width="2"/>
      <text x="100" y="105" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">2</text>
    </g>
    
    <text x="0" y="60" font-size="12" text-anchor="middle" fill="#2980b9">幻和 S = 15</text>
  </g>
  
  <!-- 右侧：图论 -->
  <g transform="translate(600, 200)">
    <text x="0" y="-100" font-size="18" font-weight="bold" text-anchor="middle" fill="#9b59b6">图论</text>
    
    <!-- 平面图 -->
    <circle cx="-30" cy="-50" r="10" fill="#9b59b6" fill-opacity="0.3" stroke="#9b59b6" stroke-width="2"/>
    <circle cx="30" cy="-50" r="10" fill="#9b59b6" fill-opacity="0.3" stroke="#9b59b6" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#9b59b6" fill-opacity="0.3" stroke="#9b59b6" stroke-width="2"/>
    <circle cx="-40" cy="30" r="10" fill="#9b59b6" fill-opacity="0.3" stroke="#9b59b6" stroke-width="2"/>
    <circle cx="40" cy="30" r="10" fill="#9b59b6" fill-opacity="0.3" stroke="#9b59b6" stroke-width="2"/>
    
    <line x1="-30" y1="-50" x2="30" y2="-50" stroke="#9b59b6" stroke-width="2"/>
    <line x1="-30" y1="-50" x2="0" y2="0" stroke="#9b59b6" stroke-width="2"/>
    <line x1="30" y1="-50" x2="0" y2="0" stroke="#9b59b6" stroke-width="2"/>
    <line x1="0" y1="0" x2="-40" y2="30" stroke="#9b59b6" stroke-width="2"/>
    <line x1="0" y1="0" x2="40" y2="30" stroke="#9b59b6" stroke-width="2"/>
    <line x1="-40" y1="30" x2="40" y2="30" stroke="#9b59b6" stroke-width="2"/>
    
    <text x="0" y="60" font-size="12" text-anchor="middle" fill="#8e44ad">四色定理</text>
    <text x="0" y="80" font-size="11" text-anchor="middle" fill="#7f8c8d">V - E + F = 2</text>
  </g>
  
  <!-- 底部：数学之美 -->
  <g transform="translate(400, 450)">
    <rect x="-350" y="-40" width="700" height="100" rx="10" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    
    <text x="0" y="-15" font-size="16" font-weight="bold" text-anchor="middle" fill="#856404">数学的趣味与美感</text>
    
    <text x="-250" y="10" font-size="13" text-anchor="middle" fill="#856404">• 完美数</text>
    <text x="-100" y="10" font-size="13" text-anchor="middle" fill="#856404">• 梅森素数</text>
    <text x="50" y="10" font-size="13" text-anchor="middle" fill="#856404">• 数独</text>
    <text x="200" y="10" font-size="13" text-anchor="middle" fill="#856404">• 魔方</text>
    
    <text x="-200" y="40" font-size="13" text-anchor="middle" fill="#856404">• 平铺问题</text>
    <text x="0" y="40" font-size="13" text-anchor="middle" fill="#856404">• 概率悖论</text>
    <text x="200" y="40" font-size="13" text-anchor="middle" fill="#856404">• 数学魔术</text>
  </g>
  
  <!-- 顶部：核心精神 -->
  <g transform="translate(400, 100)">
    <rect x="-300" y="-25" width="600" height="50" rx="8" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
    <text x="0" y="0" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">娱乐数学的精神</text>
    <text x="0" y="20" font-size="12" text-anchor="middle" fill="#34495e">好奇心 • 创造性 • 美感 • 智力挑战</text>
  </g>
</svg>
