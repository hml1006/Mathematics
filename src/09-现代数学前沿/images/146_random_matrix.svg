<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">随机矩阵理论：谱统计</text>
  
  <!-- 左侧：Wigner半圆律 -->
  <g transform="translate(200, 280)">
    <text x="0" y="-150" font-size="18" font-weight="bold" text-anchor="middle" fill="#e74c3c">Wigner半圆律</text>
    
    <!-- 坐标轴 -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#95a5a6" stroke-width="1.5"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#95a5a6" stroke-width="1.5"/>
    
    <!-- 半圆分布 -->
    <path d="M -100 0 Q -100 -100 0 -100 Q 100 -100 100 0" fill="#e74c3c" fill-opacity="0.3" stroke="#e74c3c" stroke-width="3"/>
    
    <!-- 标注 -->
    <text x="-100" y="20" font-size="12" text-anchor="middle" fill="#7f8c8d">-2</text>
    <text x="100" y="20" font-size="12" text-anchor="middle" fill="#7f8c8d">2</text>
    <text x="0" y="-110" font-size="12" text-anchor="middle" fill="#7f8c8d">ρ(x)</text>
    
    <!-- 公式 -->
    <text x="0" y="50" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">ρ(x) = (1/2π)√(4-x²)</text>
    <text x="0" y="70" font-size="12" text-anchor="middle" fill="#7f8c8d">|x| ≤ 2</text>
  </g>
  
  <!-- 右侧：特征值排斥 -->
  <g transform="translate(600, 280)">
    <text x="0" y="-150" font-size="18" font-weight="bold" text-anchor="middle" fill="#3498db">特征值间距分布</text>
    
    <!-- 坐标轴 -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#95a5a6" stroke-width="1.5"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#95a5a6" stroke-width="1.5"/>
    
    <!-- Wigner surmise曲线 -->
    <path d="M 0 0 Q 20 -80 60 -100 Q 100 -100 120 -80" fill="none" stroke="#3498db" stroke-width="3"/>
    
    <!-- Poisson分布对比 -->
    <path d="M 0 -100 L 120 -100" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="120" y="-105" font-size="11" fill="#95a5a6">Poisson</text>
    
    <!-- 标注 -->
    <text x="60" y="-110" font-size="11" fill="#3498db">GUE</text>
    <text x="0" y="20" font-size="12" text-anchor="middle" fill="#7f8c8d">0</text>
    <text x="60" y="20" font-size="12" text-anchor="middle" fill="#7f8c8d">s</text>
    
    <!-- 公式 -->
    <text x="0" y="50" font-size="13" text-anchor="middle" fill="#2980b9" font-weight="bold">P(s) ~ s² exp(-4s²/π)</text>
    <text x="0" y="70" font-size="12" text-anchor="middle" fill="#7f8c8d">特征值排斥效应</text>
  </g>
  
  <!-- 底部：三大系综 -->
  <g transform="translate(400, 480)">
    <rect x="-350" y="-35" width="700" height="70" rx="10" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
    
    <text x="-200" y="-10" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">GOE (β=1)</text>
    <text x="-200" y="10" font-size="12" text-anchor="middle" fill="#7f8c8d">实对称矩阵</text>
    
    <text x="0" y="-10" font-size="14" font-weight="bold" text-anchor="middle" fill="#3498db">GUE (β=2)</text>
    <text x="0" y="10" font-size="12" text-anchor="middle" fill="#7f8c8d">Hermite矩阵</text>
    
    <text x="200" y="-10" font-size="14" font-weight="bold" text-anchor="middle" fill="#9b59b6">GSE (β=4)</text>
    <text x="200" y="10" font-size="12" text-anchor="middle" fill="#7f8c8d">四元数自对偶</text>
  </g>
  
  <!-- 顶部：应用领域 -->
  <g transform="translate(400, 100)">
    <rect x="-300" y="-25" width="600" height="50" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <text x="0" y="0" font-size="14" text-anchor="middle" fill="#856404" font-weight="bold">跨领域应用</text>
    <text x="0" y="20" font-size="12" text-anchor="middle" fill="#856404">数论（Riemann零点）• 量子混沌 • 统计学 • 机器学习</text>
  </g>
</svg>
