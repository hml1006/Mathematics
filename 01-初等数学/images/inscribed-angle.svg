<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <!-- 圆 -->
  <circle cx="300" cy="225" r="180" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>

  <!-- 圆心 O -->
  <circle cx="300" cy="225" r="4" fill="#c62828"/>
  <text x="310" y="220" font-size="14" font-weight="bold" fill="#c62828">O</text>

  <!-- 弧 AB（A(144.12,135)和B(455.88,135)在圆上） -->
  <path d="M 144.12,135 A 180,180 0 0,1 455.88,135" fill="none" stroke="#e65100" stroke-width="3"/>
  <circle cx="144.12" cy="135" r="4" fill="#333"/>
  <circle cx="455.88" cy="135" r="4" fill="#333"/>
  <text x="130" y="130" font-size="14" font-weight="bold">A</text>
  <text x="462" y="130" font-size="14" font-weight="bold">B</text>

  <!-- 圆心角 ∠AOB -->
  <line x1="300" y1="225" x2="144.12" y2="135" stroke="#c62828" stroke-width="2"/>
  <line x1="300" y1="225" x2="455.88" y2="135" stroke="#c62828" stroke-width="2"/>
  <path d="M 265.36,205 A 40,40 0 0,0 334.64,205" fill="none" stroke="#c62828" stroke-width="2.5"/>
  <text x="295" y="195" font-size="14" font-weight="bold" fill="#c62828">∠AOB</text>

  <!-- 圆周角 ∠ACB（C(210,380.88)在圆上） -->
  <circle cx="210" cy="380.88" r="4" fill="#333"/>
  <text x="195" y="395" font-size="14" font-weight="bold">C</text>
  <line x1="210" y1="380.88" x2="144.12" y2="135" stroke="#2e7d32" stroke-width="2"/>
  <line x1="210" y1="380.88" x2="455.88" y2="135" stroke="#2e7d32" stroke-width="2"/>
  <path d="M 202.23,351.90 A 30,30 0 0,0 231.21,359.67" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="180" y="365" font-size="14" font-weight="bold" fill="#2e7d32">∠ACB</text>

  <!-- 另一个圆周角 ∠ADB（D(390,380.88)在圆上） -->
  <circle cx="390" cy="380.88" r="4" fill="#333"/>
  <text x="395" y="395" font-size="14" font-weight="bold">D</text>
  <line x1="390" y1="380.88" x2="144.12" y2="135" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="390" y1="380.88" x2="455.88" y2="135" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="5,3"/>
  <path d="M 368.79,359.67 A 30,30 0 0,1 397.77,351.90" fill="none" stroke="#7b1fa2" stroke-width="2.5"/>
  <text x="410" y="365" font-size="14" font-weight="bold" fill="#7b1fa2">∠ADB</text>

  <!-- 说明 -->
  <text x="300" y="420" font-size="14" text-anchor="middle" font-weight="bold">同弧所对的圆周角等于圆心角的一半</text>
  <text x="300" y="440" font-size="13" text-anchor="middle">∠ACB = ∠ADB = ½∠AOB</text>
</svg>