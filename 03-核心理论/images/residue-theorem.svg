<?xml version="1.0" encoding="utf-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="400" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">
    留数定理
  </text>
  
  <!-- Closed contour γ -->
  <ellipse cx="250" cy="210" rx="180" ry="130" fill="#fff8e1" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  
  <!-- Label for γ -->
  <text x="400" y="100" font-family="sans-serif" font-size="16" font-style="italic" fill="#2e7d32">γ</text>
  
  <!-- Singularities (poles) inside contour -->
  <!-- z₁ - simple pole -->
  <circle cx="180" cy="200" r="6" fill="#c44e52" opacity="0.8"/>
  <circle cx="180" cy="200" r="3" fill="#fff"/>
  <text x="180" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic" fill="#c44e52">z₁</text>
  
  <!-- z₂ - pole of order 2 -->
  <circle cx="280" cy="180" r="8" fill="#c44e52" opacity="0.8"/>
  <circle cx="280" cy="180" r="4" fill="#fff"/>
  <text x="280" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic" fill="#c44e52">z₂</text>
  
  <!-- z₃ - simple pole -->
  <circle cx="320" cy="250" r="6" fill="#c44e52" opacity="0.8"/>
  <circle cx="320" cy="250" r="3" fill="#fff"/>
  <text x="320" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic" fill="#c44e52">z₃</text>
  
  <!-- Residue labels -->
  <text x="140" y="180" font-family="sans-serif" font-size="11" fill="#666">Res(<tspan font-style="italic">f</tspan>, z₁)</text>
  <text x="300" y="160" font-family="sans-serif" font-size="11" fill="#666">Res(<tspan font-style="italic">f</tspan>, z₂)</text>
  <text x="350" y="240" font-family="sans-serif" font-size="11" fill="#666">Res(<tspan font-style="italic">f</tspan>, z₃)</text>
  
  <!-- Formula box -->
  <rect x="80" y="340" width="340" height="50" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="250" y="365" text-anchor="middle" font-family="serif" font-size="16" fill="#e65100">
    ∮<tspan font-style="italic">γ</tspan> <tspan font-style="italic">f</tspan>(<tspan font-style="italic">z</tspan>) d<tspan font-style="italic">z</tspan> = 2π<tspan font-style="italic">i</tspan> Σ Res(<tspan font-style="italic">f</tspan>, zₖ)
  </text>
  
  <!-- Annotation -->
  <text x="250" y="395" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">
    围道积分 = 2πi × 内部奇点留数之和
  </text>
</svg>
