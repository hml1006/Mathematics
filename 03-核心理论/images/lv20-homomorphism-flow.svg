<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow-main" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#2c3e50"/>
    </marker>
    <marker id="arrow-phi" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="300" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    群同态：保持结构的映射
  </text>
  
  <!-- 群 G -->
  <rect x="50" y="80" width="150" height="200" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="125" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1565c0">群 G</text>
  
  <!-- G 中的元素 -->
  <circle cx="90" cy="150" r="15" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5"/>
  <text x="90" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0d47a1">a</text>
  
  <circle cx="160" cy="150" r="15" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5"/>
  <text x="160" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0d47a1">b</text>
  
  <circle cx="125" cy="210" r="15" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5"/>
  <text x="125" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0d47a1">ab</text>
  
  <!-- G 中的运算 -->
  <path d="M 105 150 L 145 150" fill="none" stroke="#1976d2" stroke-width="1.5" marker-end="url(#arrow-main)"/>
  <path d="M 125 165 L 125 195" fill="none" stroke="#1976d2" stroke-width="1.5" marker-end="url(#arrow-main)"/>
  <text x="125" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1976d2">运算: a·b</text>
  
  <!-- 同态映射 φ -->
  <path d="M 210 180 L 380 180" fill="none" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrow-phi)"/>
  <text x="295" y="165" font-family="Arial, sans-serif" font-size="22" font-weight="bold" font-style="italic" text-anchor="middle" fill="#e74c3c">φ</text>
  <text x="295" y="205" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#c0392b">保持运算结构</text>
  
  <!-- 群 H -->
  <rect x="400" y="80" width="150" height="200" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="475" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ad1457">群 H</text>
  
  <!-- H 中的元素 -->
  <circle cx="440" cy="150" r="15" fill="#f8bbd0" stroke="#c2185b" stroke-width="1.5"/>
  <text x="440" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#880e4f">φ(a)</text>
  
  <circle cx="510" cy="150" r="15" fill="#f8bbd0" stroke="#c2185b" stroke-width="1.5"/>
  <text x="510" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#880e4f">φ(b)</text>
  
  <circle cx="475" cy="210" r="15" fill="#f8bbd0" stroke="#c2185b" stroke-width="1.5"/>
  <text x="475" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#880e4f">φ(a)φ(b)</text>
  
  <!-- H 中的运算 -->
  <path d="M 455 150 L 495 150" fill="none" stroke="#c2185b" stroke-width="1.5" marker-end="url(#arrow-main)"/>
  <path d="M 475 165 L 475 195" fill="none" stroke="#c2185b" stroke-width="1.5" marker-end="url(#arrow-main)"/>
  <text x="475" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#c2185b">运算: φ(a)*φ(b)</text>
  
  <!-- 同态性质说明 -->
  <rect x="100" y="290" width="400" height="60" rx="8" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="300" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#f57f17">
    同态基本性质
  </text>
  <text x="300" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#795548">
    φ(a·b) = φ(a) * φ(b)
  </text>
  
  <!-- 现实类比 -->
  <rect x="50" y="360" width="500" height="30" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="300" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2e7d32">
    类比：同态像"密码本"——把G中的运算规则完美翻译成H中的运算规则
  </text>
</svg>
