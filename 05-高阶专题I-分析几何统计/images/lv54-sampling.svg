<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sigGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Nyquist-Shannon 采样定理：从离散采样恢复连续信号
  </text>
  
  <!-- Continuous signal -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#34495e">连续带限信号 f(x)</text>
    <path d="M 0,80 C 30,40 60,30 100,50 C 140,70 170,90 210,60 C 250,30 280,25 320,55 C 360,85 390,95 430,65 C 470,35 500,30 540,55 C 580,80 610,90 650,65 C 680,45 700,50 700,50" 
          stroke="url(#sigGrad)" stroke-width="2.5" fill="none"/>
    
    <!-- Sampling points -->
    <circle cx="0" cy="80" r="5" fill="#e74c3c"/>
    <circle cx="100" cy="50" r="5" fill="#e74c3c"/>
    <circle cx="210" cy="60" r="5" fill="#e74c3c"/>
    <circle cx="320" cy="55" r="5" fill="#e74c3c"/>
    <circle cx="430" cy="65" r="5" fill="#e74c3c"/>
    <circle cx="540" cy="55" r="5" fill="#e74c3c"/>
    <circle cx="650" cy="65" r="5" fill="#e74c3c"/>
    
    <!-- Sampling interval annotation -->
    <line x1="0" y1="110" x2="100" y2="110" stroke="#e74c3c" stroke-width="1.5" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
    <text x="50" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c">Δt = 1/(2W)</text>
    
    <!-- Axis -->
    <line x1="0" y1="100" x2="700" y2="100" stroke="#95a5a6" stroke-width="1"/>
    <text x="710" y="105" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">t (时间)</text>
  </g>
  
  <!-- Discrete samples -->
  <g transform="translate(50, 220)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#34495e">离散采样值 f(n/(2W))</text>
    
    <!-- Stem plot -->
    <line x1="0" y1="80" x2="0" y2="20" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="0" cy="20" r="4" fill="#e74c3c"/>
    
    <line x1="100" y1="80" x2="100" y2="50" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="100" cy="50" r="4" fill="#e74c3c"/>
    
    <line x1="210" y1="80" x2="210" y2="40" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="210" cy="40" r="4" fill="#e74c3c"/>
    
    <line x1="320" y1="80" x2="320" y2="45" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="320" cy="45" r="4" fill="#e74c3c"/>
    
    <line x1="430" y1="80" x2="430" y2="35" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="430" cy="35" r="4" fill="#e74c3c"/>
    
    <line x1="540" y1="80" x2="540" y2="45" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="540" cy="45" r="4" fill="#e74c3c"/>
    
    <line x1="650" y1="80" x2="650" y2="35" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="650" cy="35" r="4" fill="#e74c3c"/>
    
    <!-- Axis -->
    <line x1="0" y1="80" x2="700" y2="80" stroke="#95a5a6" stroke-width="1"/>
  </g>
  
  <!-- Reconstruction with sinc functions -->
  <g transform="translate(50, 350)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#34495e">sinc 插值重建：f(x) = Σ f(n/(2W)) · sinc(2W(x - n/(2W)))</text>
    
    <!-- Individual sinc functions (faded) -->
    <path d="M -30,60 Q -15,30 0,20 Q 15,30 30,60 Q 45,75 60,60" stroke="#3498db" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M 70,60 Q 85,35 100,25 Q 115,35 130,60 Q 145,75 160,60" stroke="#3498db" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M 180,60 Q 195,40 210,30 Q 225,40 240,60 Q 255,75 270,60" stroke="#3498db" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M 290,60 Q 305,42 320,32 Q 335,42 350,60 Q 365,75 380,60" stroke="#3498db" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M 400,60 Q 415,38 430,28 Q 445,38 460,60 Q 475,75 490,60" stroke="#3498db" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M 510,60 Q 525,42 540,32 Q 555,42 570,60 Q 585,75 600,60" stroke="#3498db" stroke-width="1" fill="none" opacity="0.3"/>
    
    <!-- Reconstructed signal (bold) -->
    <path d="M 0,60 C 30,20 60,10 100,30 C 140,50 170,70 210,40 C 250,10 280,5 320,35 C 360,65 390,75 430,45 C 470,15 500,10 540,35 C 580,60 610,70 650,45" 
          stroke="#27ae60" stroke-width="2.5" fill="none"/>
    
    <!-- Axis -->
    <line x1="0" y1="80" x2="700" y2="80" stroke="#95a5a6" stroke-width="1"/>
    <text x="710" y="85" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">t</text>
  </g>
  
  <!-- Key formula box -->
  <rect x="50" y="455" width="700" height="35" fill="#ecf0f1" rx="6" stroke="#27ae60" stroke-width="1.5"/>
  <text x="400" y="478" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="bold">
    采样率 ≥ 2W（Nyquist 率）→ 完美重建 | 现实应用：CD 音频采样率 44.1kHz > 2×20kHz 人耳上限
  </text>
</svg>
