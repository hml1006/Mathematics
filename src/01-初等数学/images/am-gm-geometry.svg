<svg xmlns="http://www.w3.org/2000/svg" width="520" height="350" viewBox="0 0 520 350" font-family="Arial, sans-serif">
  <!-- 标题 -->
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">AM-GM 均值不等式的几何证明（半圆构造）</text>

  <!-- ===== 半圆：圆心 M(260,250)、半径 R=180，直径 A(80,250) —— B(440,250) ===== -->
  <!-- 直径 AB -->
  <line x1="80" y1="250" x2="440" y2="250" stroke="#1a73e8" stroke-width="3.5"/>
  <!-- 半圆上弧（圆心 M(260,250) 半径 180，顶点 (260,70)；D 精确落在其上） -->
  <path d="M 80,250 A 180,180 0 0 1 440,250" fill="none" stroke="#1a73e8" stroke-width="3"/>

  <!-- 三角形 ADB（泰勒斯定理：AB 为直径，故 ∠ADB = 90°） -->
  <line x1="80" y1="250" x2="152" y2="106" stroke="#7e57c2" stroke-width="2"/>
  <line x1="152" y1="106" x2="440" y2="250" stroke="#7e57c2" stroke-width="2"/>
  <!-- 直角标记 ∠D -->
  <polyline points="152,106 144.84,120.31 159.15,127.46 166.31,113.15" fill="none" stroke="#7e57c2" stroke-width="1.6"/>

  <!-- 圆心 M -->
  <circle cx="260" cy="250" r="5" fill="#222"/>
  <text x="268" y="242" font-size="16" font-weight="bold" fill="#222">M（圆心＝直径中点）</text>

  <!-- 直径端点 A、B -->
  <circle cx="80" cy="250" r="4" fill="#a33c10"/>
  <text x="66" y="272" font-size="16" fill="#a33c10">A</text>
  <circle cx="440" cy="250" r="4" fill="#0a43a3"/>
  <text x="430" y="272" font-size="16" fill="#0a43a3">B</text>

  <!-- 分割点 C：AC=a=2 格(72px)，CB=b=8 格(288px)，坐标(152,250) -->
  <line x1="80" y1="250" x2="152" y2="250" stroke="#a33c10" stroke-width="6"/>
  <circle cx="152" cy="250" r="4.5" fill="#c0392b"/>
  <text x="108" y="242" font-size="14" fill="#a33c10">a</text>
  <text x="287" y="242" font-size="14" fill="#0a43a3">b</text>
  <text x="139" y="272" font-size="15" font-weight="bold" fill="#c0392b">C</text>

  <!-- 半径 AM（算术平均），从 A 到圆心 M -->
  <line x1="80" y1="250" x2="260" y2="250" stroke="#008000" stroke-width="2.2" stroke-dasharray="6,5"/>
  <!-- 垂直弦 CD（几何平均）：C(152,250) -> D(152,106) -->
  <line x1="152" y1="250" x2="152" y2="106" stroke="#d93025" stroke-width="3"/>
  <circle cx="152" cy="106" r="4.5" fill="#d93025"/>
  <text x="137" y="100" font-size="15" font-weight="bold" fill="#d93025">D</text>
  <!-- 直角记号 at C -->
  <polyline points="152,240 162,240 162,250" fill="none" stroke="#333" stroke-width="1.6"/>

  <!-- 标注：半径 AM 与垂直弦 CD -->
  <text x="170" y="172" font-size="14" fill="#d93025">CD = √ab ＝ 几何平均 GM</text>
  <line x1="150" y1="172" x2="152" y2="180" stroke="#d93025" stroke-width="1.4" stroke-dasharray="3,3"/>
  <text x="170" y="262" font-size="14" fill="#008000">AM ＝ (a+b)/2 ＝ 算术平均（半径）</text>

  <!-- 比较结论 -->
  <rect x="60" y="292" width="400" height="40" rx="8" fill="#fff6b3" stroke="#ffa500"/>
  <text x="75" y="318" font-size="15" fill="#a33c10" font-weight="bold">垂直弦 CD ≤ 半径 AM（图中 CD 在半径内） ⇒  √ab ≤ (a+b)/2</text>
  <text x="75" y="330" font-size="13" fill="#555">等号当 C 与圆心 M 重合（a=b）时，垂直弦恰为直径</text>
</svg>