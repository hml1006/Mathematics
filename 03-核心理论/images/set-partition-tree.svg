<?xml version="1.0" encoding="utf-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="504pt" height="360pt" viewBox="0 0 504 360">
 <defs>
  <style type="text/css">
   text { font-family: 'Noto Sans CJK SC', 'SimHei', sans-serif; }
  </style>
 </defs>
 <rect width="504" height="360" fill="#ffffff"/>
 <!-- Title -->
 <text x="252" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">集合划分：第二类 Stirling 数 S(n,k)</text>
 <text x="252" y="48" text-anchor="middle" font-size="11" fill="#666666">S(4,2) = 7：将 4 个不同元素划分成 2 个非空子集</text>

 <!-- Root node -->
 <circle cx="252" cy="80" r="20" fill="#4c72b0" stroke="#333333" stroke-width="2"/>
 <text x="252" y="86" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">{1,2,3,4}</text>

 <!-- Level 1: Two partitions -->
 <line x1="252" y1="100" x2="150" y2="150" stroke="#666666" stroke-width="1.5"/>
 <line x1="252" y1="100" x2="354" y2="150" stroke="#666666" stroke-width="1.5"/>

 <circle cx="150" cy="170" r="18" fill="#ed7d31" stroke="#333333" stroke-width="1.5"/>
 <text x="150" y="176" text-anchor="middle" font-size="10" fill="#ffffff">分法 1</text>

 <circle cx="354" cy="170" r="18" fill="#ed7d31" stroke="#333333" stroke-width="1.5"/>
 <text x="354" y="176" text-anchor="middle" font-size="10" fill="#ffffff">分法 2</text>

 <!-- Level 2: Show some partitions -->
 <!-- Left branch: {1,2} and {3,4} -->
 <line x1="150" y1="188" x2="100" y2="230" stroke="#666666" stroke-width="1"/>
 <line x1="150" y1="188" x2="200" y2="230" stroke="#666666" stroke-width="1"/>

 <rect x="60" y="230" width="80" height="30" rx="5" fill="#5b9bd5" stroke="#4c72b0"/>
 <text x="100" y="250" text-anchor="middle" font-size="11" fill="#ffffff">{1,2}</text>

 <rect x="160" y="230" width="80" height="30" rx="5" fill="#5b9bd5" stroke="#4c72b0"/>
 <text x="200" y="250" text-anchor="middle" font-size="11" fill="#ffffff">{3,4}</text>

 <!-- Right branch: {1} and {2,3,4} -->
 <line x1="354" y1="188" x2="304" y2="230" stroke="#666666" stroke-width="1"/>
 <line x1="354" y1="188" x2="404" y2="230" stroke="#666666" stroke-width="1"/>

 <rect x="264" y="230" width="80" height="30" rx="5" fill="#70ad47" stroke="#548235"/>
 <text x="304" y="250" text-anchor="middle" font-size="11" fill="#ffffff">{1}</text>

 <rect x="364" y="230" width="80" height="30" rx="5" fill="#70ad47" stroke="#548235"/>
 <text x="404" y="250" text-anchor="middle" font-size="11" fill="#ffffff">{2,3,4}</text>

 <!-- List all 7 partitions -->
 <text x="50" y="290" font-size="12" font-weight="bold" fill="#333333">S(4,2) = 7 种划分：</text>

 <text x="50" y="310" font-size="10" fill="#333333">1. {1,2} | {3,4}</text>
 <text x="50" y="325" font-size="10" fill="#333333">2. {1,3} | {2,4}</text>
 <text x="50" y="340" font-size="10" fill="#333333">3. {1,4} | {2,3}</text>

 <text x="250" y="310" font-size="10" fill="#333333">4. {1} | {2,3,4}</text>
 <text x="250" y="325" font-size="10" fill="#333333">5. {2} | {1,3,4}</text>
 <text x="250" y="340" font-size="10" fill="#333333">6. {3} | {1,2,4}</text>
 <text x="250" y="355" font-size="10" fill="#333333">7. {4} | {1,2,3}</text>

 <!-- Formula -->
 <text x="450" y="310" font-size="10" fill="#666666" text-anchor="end">递推公式：</text>
 <text x="450" y="325" font-size="10" fill="#666666" text-anchor="end">S(n,k) = S(n-1,k-1)</text>
 <text x="450" y="340" font-size="10" fill="#666666" text-anchor="end">         + k·S(n-1,k)</text>
</svg>
